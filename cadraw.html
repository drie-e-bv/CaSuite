<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CaDraw - eendraadschema en situatieplan</title>
<!-- CaDraw (testversie, 2026-11-16). Losstaande pagina van CaSuite: eendraadschema + situatieplan.
     Leest CaDos (project_elektro_dossiers) en CaCalc (project_cacalc_data), bewaart in
     project_cadraw_data en schrijft gewijzigde waarden van gekoppelde kringen terug naar CaDos.
     Draait ook zonder Supabase (lokale modus) wanneer de pagina niet op de CaSuite-site staat. -->
<style>
:root{--ink:#16181c;--mut:#667085;--line:#d9dde3;--bg:#f4f5f7;--card:#fff;--acc:#0b6bcb;--warn:#b54708;--warnbg:#fff4e5;--infobg:#eef4ff;--danger:#b42318}
*{box-sizing:border-box}
html,body{margin:0}
body{font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-text-size-adjust:100%}
header{background:#101114;color:#fff;padding:9px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px}
header .tag{font-size:11px;border:1px solid #555;border-radius:20px;padding:1px 8px;color:#cfd3da}
header .sp{flex:1}
#cst{font-size:12px;color:#aab0ba}
nav{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);display:flex;overflow-x:auto}
nav button{flex:1;min-width:84px;border:0;border-radius:0;background:none;padding:11px 8px;font:inherit;font-weight:600;color:var(--mut);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--ink);border-bottom-color:var(--acc)}
nav .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--warn);color:#fff;font-size:11px;line-height:18px}
main{padding:12px;max-width:1280px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.card>h2{font-size:14px;margin:0 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card>h2 small{font-weight:400;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f.w2{grid-column:span 2}
.f span{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
input,select,textarea{font:inherit;color:inherit;border:1px solid var(--line);border-radius:7px;padding:7px 8px;background:#fff;min-width:0;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid #b9d6f5;border-color:var(--acc)}
button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 11px;cursor:pointer;color:var(--ink)}
button:hover{background:#f1f3f6}
button.pri,button.on2{background:var(--acc);border-color:var(--acc);color:#fff}
button.danger{color:var(--danger)}
button.sm{padding:4px 8px;font-size:13px}
header button{background:#23252b;border-color:#3a3d45;color:#fff}
header button:hover{background:#30333b}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.row select,.row input{width:auto;max-width:100%}
.lb{background:#101114;color:#fff;border-radius:5px;padding:1px 7px;font-size:13px}
details.k{border:1px solid var(--line);border-radius:8px;margin-top:8px;background:#fcfcfd}
details.k>summary{padding:9px 10px;cursor:pointer;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;list-style:none}
details.k>summary::-webkit-details-marker{display:none}
details.k>summary .kn{font-weight:600}
details.k>summary small{color:var(--mut);margin-left:auto}
details.k[open]{background:#fff;border-color:#b9c0cb}
details.k .in{padding:2px 10px 10px}
.pt{display:grid;grid-template-columns:22px minmax(120px,1.4fr) 54px minmax(80px,1fr) auto auto auto;gap:5px;align-items:center;margin-top:6px}
.pt .no{font-weight:700;color:var(--mut);text-align:right;font-size:13px}
.pt .hw{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--mut);white-space:nowrap}
.pt .hw input{width:auto}
@media(max-width:560px){.pt{grid-template-columns:22px 1fr 54px auto auto}.pt .tx{grid-column:2/3;grid-row:2}.pt .hw{grid-column:3/6;grid-row:2}}
.pages{overflow:auto;background:#8d939c;border-radius:10px;padding:10px;max-height:78vh}
.pages svg{display:block;background:#fff;margin:0 auto 10px;box-shadow:0 1px 6px rgba(0,0,0,.35)}
.pages svg text{font-family:Helvetica,Arial,sans-serif;fill:#000;user-select:none}
.pages svg .hit{fill:transparent;cursor:pointer}
.pages svg .hit:hover{fill:rgba(11,107,203,.08)}
.pages svg .hit.sel{fill:rgba(11,107,203,.13);stroke:#0b6bcb;stroke-width:.3}
.pages svg .addm{cursor:pointer}
.pages svg .addm circle{fill:#0b6bcb;stroke:#fff;stroke-width:.3}
.pages svg .addm path{stroke:#fff;stroke-width:.5;stroke-linecap:round}
.pages svg .addm:hover circle{fill:#084f97}
.ws{display:grid;grid-template-columns:300px minmax(0,1fr);gap:12px;align-items:start}
.ws .side{position:sticky;top:52px;max-height:calc(100vh - 64px);overflow:auto}
.lib{overflow:auto;max-height:46vh;border:1px solid var(--line);border-radius:8px;margin-top:8px}
@media(max-width:860px){.ws{grid-template-columns:minmax(0,1fr)}.ws .side{position:static;max-height:none}.lib{max-height:200px}}
.lib h4{margin:0;padding:5px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);background:#f4f5f7;position:sticky;top:0}
.sy{display:flex;align-items:center;gap:8px;width:100%;border:0;border-radius:0;border-bottom:1px solid #eef0f3;padding:5px 8px;text-align:left;font-size:13.5px}
.sy svg{flex:none;width:44px;height:30px}
.sy.on{background:#e3effc;box-shadow:inset 3px 0 0 var(--acc)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;border-radius:0;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--acc);color:#fff}
.chkl{display:flex;align-items:center;gap:8px;padding:6px 0}.chkl input{width:auto}
#plan .pi{cursor:grab;touch-action:none}
#plan .pi .hb{fill:transparent}
#plan .pi.sel .hb{fill:rgba(11,107,203,.14);stroke:#0b6bcb;stroke-width:.8}
#plan .wl{stroke:transparent;stroke-width:14;cursor:pointer}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut)}
td.n,th.n{text-align:right;white-space:nowrap}
.tw{overflow-x:auto}
.chk{border-radius:8px;padding:9px 11px;margin-top:7px;display:flex;gap:9px;align-items:flex-start;cursor:pointer;border:1px solid transparent}
.chk.w{background:var(--warnbg);border-color:#f5d6ad}
.chk.i{background:var(--infobg);border-color:#cfe0fb}
.note{color:var(--mut);font-size:13px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#101114;color:#fff;padding:9px 14px;border-radius:9px;display:none;gap:12px;align-items:center;z-index:30;max-width:92vw;box-shadow:0 4px 16px rgba(0,0,0,.3)}
#toast button{background:none;border:0;color:#8ec5ff;padding:0;font-weight:600}
#ovl{position:fixed;inset:0;background:rgba(16,17,20,.55);z-index:20;display:none;align-items:flex-start;justify-content:center;padding:6vh 12px;overflow:auto}
#ovl .card{width:100%;max-width:560px}
.pl{display:flex;justify-content:space-between;gap:8px;padding:9px 6px;border-bottom:1px solid var(--line);cursor:pointer}
.pl:hover{background:#f1f3f6}
.pl small{color:var(--mut)}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
"use strict";
/* ================= basis ================= */
const KEY='cadraw-lokaal-v2';
const CLOUD=/github\.io$/.test(location.hostname)||/^(localhost|127\.0\.0\.1)$/.test(location.hostname)||/[?&]cloud=1/.test(location.search);
const SUPABASE_URL='https://eownpxplsnqbghcggugs.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVvd25weHBsc25xYmdoY2dndWdzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMDg1MDcsImV4cCI6MjEwMjY4NDUwN30.KmzypFOwMvH5Rf_AK9EGDt2593vrqHn1UR-WSiURXZs';
const uid=()=>'m'+Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const letters=n=>{let s='';n++;while(n>0){n--;s=String.fromCharCode(65+n%26)+s;n=Math.floor(n/26)}return s};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'');
const $=s=>document.querySelector(s);

const TYPES={
 sc_ak:{l:'Stopcontact geaard + kinderveiligheid',c:'sc',g:'Stopcontacten'},
 sc_a:{l:'Stopcontact geaard',c:'sc',g:'Stopcontacten'},
 sc:{l:'Stopcontact zonder aarding',c:'sc',g:'Stopcontacten'},
 li:{l:'Lichtpunt',c:'li',g:'Verlichting'},
 li_w:{l:'Wandlichtpunt',c:'li',g:'Verlichting'},
 li_spot:{l:'Spot',c:'li',g:'Verlichting'},
 li_tl:{l:'TL / lijnverlichting',c:'li',g:'Verlichting'},
 li_n:{l:'Noodverlichting (autonoom)',c:'li',g:'Verlichting'},
 li_nc:{l:'Noodverlichting (centraal)',c:'li',g:'Verlichting'},
 sw1:{l:'Schakelaar enkelpolig',c:'sw',g:'Schakelaars'},
 sw2:{l:'Schakelaar dubbelpolig',c:'sw',g:'Schakelaars'},
 sww:{l:'Wisselschakelaar',c:'sw',g:'Schakelaars'},
 swd:{l:'Dubbele aansteking',c:'sw',g:'Schakelaars'},
 swk:{l:'Kruisschakelaar',c:'sw',g:'Schakelaars'},
 dk:{l:'Drukknop',c:'sw',g:'Schakelaars'},
 dim:{l:'Dimmer',c:'sw',g:'Schakelaars'},
 bm:{l:'Bewegingsmelder',c:'sw',g:'Schakelaars'},
 t_was:{l:'Wasmachine',c:'toe',g:'Toestellen'},
 t_droog:{l:'Droogkast',c:'toe',g:'Toestellen'},
 t_vaat:{l:'Vaatwasmachine',c:'toe',g:'Toestellen'},
 t_kook:{l:'Kookfornuis',c:'toe',g:'Toestellen'},
 t_oven:{l:'Elektrische oven',c:'toe',g:'Toestellen'},
 t_micro:{l:'Microgolfoven',c:'toe',g:'Toestellen'},
 t_koel:{l:'Koelkast',c:'toe',g:'Toestellen'},
 t_vries:{l:'Diepvriezer',c:'toe',g:'Toestellen'},
 t_boiler:{l:'Boiler',c:'toe',g:'Toestellen'},
 t_verw:{l:'Verwarmingstoestel',c:'toe',g:'Toestellen'},
 t_motor:{l:'Motor',c:'toe',g:'Toestellen'},
 t_vent:{l:'Ventilator',c:'toe',g:'Toestellen'},
 t_ev:{l:'Laadstation auto',c:'toe',g:'Toestellen'},
 t_trafo:{l:'Transformator',c:'toe',g:'Toestellen'},
 t_bel:{l:'Bel',c:'toe',g:'Toestellen'},
 t_pv:{l:'Omvormer zonnepanelen',c:'toe',g:'Toestellen'},
 t_gen:{l:'Toestel (vrije tekst)',c:'toe',g:'Toestellen'},
 af:{l:'Aftakkast',c:'div',g:'Overige'},
 ap:{l:'Aansluitpunt',c:'div',g:'Overige'},
 dom:{l:'Module / klein toestel (tekst)',c:'div',g:'Overige'}
};
const NETTEN=['3 x 400V + N ~ 50Hz','3 x 230V ~ 50Hz','1 x 230V + N ~ 50Hz'];
const AMP=[2,4,6,10,13,16,20,25,32,40,50,63,80,100,125],POL=['1P','2P','3P','4P'];

/* ================= model ================= */
const newKring=(o={})=>Object.assign({id:uid(),naam:'',polen:'2P',curve:'C',A:20,kA:3,kabelType:'XVB',kabel:'3G2,5',lengte:'',punten:[]},o);
const newPunt=(type='sc_ak',o={})=>Object.assign({id:uid(),type,aantal:1,tekst:'',hw:false},o);
const newGroep=(o={})=>Object.assign({id:uid(),sub:true,mA:30,A:40,polen:'2P',type:'A',kringen:[]},o);
const newBord=(o={})=>Object.assign({id:uid(),naam:'Zekeringkast 1',hoofd:{mA:300,A:40,polen:'4P',type:'A'},groepen:[{id:uid(),sub:false,kringen:[]}]},o);
const newPlan=(naam='Gelijkvloers')=>({id:uid(),naam,h:707,sym:3,muren:[],items:[],bg:null});
function blank(){return{v:2,codering:'cados',
 project:{naam:'',adres:'',klant:'',installateur:'Casentis',tekenaar:'',organisme:'',ean:'',datum:new Date().toISOString().slice(0,10),net:NETTEN[0],voeding:'EXVB 4x10',aarding:'< 30 Ω'},
 borden:[newBord()],plannen:[newPlan()],kamers:[],print:{schema:true,plan:true,kringen:true,mat:false}}}
const num=v=>parseInt(String(v??'').replace(/[^\d]/g,''),10)||'';
const kabFmt=s=>String(s||'').trim().toUpperCase().replace('.',',');

/* ---- import uit CaDos (project_elektro_dossiers.data) : zelfde groeps- en codelogica als CaDos ---- */
function cadosCodes(rijen){
 const L='ABCDEFGHIJKLMNOPQRSTUVWXYZ',flat=[],byId={},groupOf={},codes={},letterOf={};
 rijen.forEach(r=>(r.items||[]).forEach(m=>{flat.push(m);byId[m.id]=m}));
 rijen.forEach(r=>{let last=null;(r.items||[]).forEach(m=>{
  if(m.categorie==='Differentieel')last=m;
  else if(m.categorie==='Automaat'&&m.isRem)last=null;
  else if(m.categorie==='Automaat'){const l=m.linkedDiffId&&byId[m.linkedDiffId];groupOf[m.id]=(l&&l.categorie==='Differentieel')?l:last}
  else last=null})});
 const hi=flat.findIndex(m=>m.categorie==='Differentieel'&&m.isHoofd);let di=-1,pi=-1;
 flat.forEach((m,i)=>{if(!(m.categorie==='Differentieel'||(m.categorie==='Automaat'&&!m.isRem&&!groupOf[m.id])))return;
  if(hi!==-1&&i<hi){pi++;letterOf[m.id]='X'+(L[pi]||('Z'+pi))}else{di++;letterOf[m.id]=L[di]||('Z'+di)}});
 const sub={};let rem=0;
 flat.forEach(m=>{if(m.categorie==='Differentieel')codes[m.id]=letterOf[m.id];
  else if(m.categorie==='Automaat'&&m.isRem){rem++;codes[m.id]='R'+rem}
  else if(m.categorie==='Automaat'){const d=groupOf[m.id];if(d){const n=sub[d.id]||0;codes[m.id]=letterOf[d.id]+(L[n]||n);sub[d.id]=n+1}else codes[m.id]=letterOf[m.id]}});
 return{codes,groupOf,flat}}
function fromCaDos(src){
 const d=(src&&src.data&&src.data.zekeringen)?src.data:src;
 if(!d||!d.zekeringen||!Array.isArray(d.zekeringen.kasten))throw new Error('Geen CaDos-dossier herkend (zekeringen.kasten ontbreekt).');
 const st=blank(),ins=d.instellingen||{};
 Object.assign(st.project,{naam:ins.project||'',adres:ins.adres||'',klant:ins.klant||'',installateur:ins.installateur||'Casentis',datum:ins.datum||st.project.datum});
 const mono=/mono/i.test(ins.spanning||'');
 st.project.net=mono?NETTEN[2]:/3\s*x\s*230/i.test(ins.spanning||'')?NETTEN[1]:NETTEN[0];
 st.kamers=(d.kamers||[]).filter(Boolean);
 const vd=(d.verdiepingen||[]).filter(v=>v&&v.label);
 if(vd.length)st.plannen=vd.map(v=>newPlan(v.label));
 st.borden=[];let over=0;
 d.zekeringen.kasten.forEach((kast,ki)=>{
  const {codes,groupOf,flat}=cadosCodes(kast.rijen||[]);
  const b=newBord({naam:kast.naam||('Zekeringkast '+(ki+1)),kastId:kast.id});b.hoofd.polen=mono?'2P':'4P';
  const direct=b.groepen[0],gmap={};let hoofd=false;
  flat.forEach(it=>{const x=it.cadraw||{};
   if(it.categorie==='Differentieel'){
    if(it.isHoofd&&!hoofd){hoofd=true;b.hoofd={mA:num(it.mA)||300,A:num(it.A)||40,polen:it.polen||b.hoofd.polen,type:x.type||'A',bron:it.id};direct.letter=codes[it.id];gmap[it.id]=direct}
    else{const g=newGroep({mA:num(it.mA)||30,A:num(it.A)||40,polen:it.polen||'2P',type:x.type||'A',bron:it.id,letter:codes[it.id]});b.groepen.push(g);gmap[it.id]=g}
   }else if(it.categorie==='Automaat'){
    const A=num(it.A)||20,kab=kabFmt(it.kabelType)||kabFmt(x.kabel),gd=groupOf[it.id],g=(gd&&gmap[gd.id])||direct;
    g.kringen.push(newKring({naam:it.naam||'',polen:it.polen||'2P',A,curve:x.curve||'C',kA:x.kA??3,kabelType:x.mantel||'XVB',lengte:x.lengte??'',
     kabel:kab||(A<=16?'3G1,5':'3G2,5'),kabelBron:kab?undefined:'standaard',bron:it.id,code:codes[it.id],rem:!!it.isRem,
     punten:(x.punten||[]).map(p=>newPunt(p.type,{id:p.id||uid(),aantal:p.aantal||1,tekst:p.tekst||'',hw:!!p.hw}))}));
   }else if(it.categorie!=='Leeg')over++;});
  b.geenHoofd=!hoofd;st.borden.push(b)});
 if(!st.borden.length)st.borden=[newBord()];
 st._over=over;return st}
/* behoudt CaDraw-gegevens (punten, curve, plannen...) wanneer CaDos opnieuw wordt ingelezen */
function keep(old,fresh){
 fresh.project=Object.assign({},fresh.project,old.project);fresh.codering=old.codering;fresh.plannen=old.plannen&&old.plannen.length?old.plannen:fresh.plannen;
 const ok={},og={};old.borden.forEach(b=>{if(b.hoofd&&b.hoofd.bron)og[b.hoofd.bron]=b.hoofd;b.groepen.forEach(g=>{if(g.bron)og[g.bron]=g;g.kringen.forEach(k=>{if(k.bron)ok[k.bron]=k})})});
 const seen=new Set();
 fresh.borden.forEach(b=>{if(og[b.hoofd.bron])b.hoofd.type=og[b.hoofd.bron].type||b.hoofd.type;
  const ob=old.borden.find(x=>x.kastId&&x.kastId===b.kastId);if(ob)b.id=ob.id;
  b.groepen.forEach(g=>{const o=og[g.bron];if(o&&g.sub){g.id=o.id;g.type=o.type||g.type}
   g.kringen.forEach(k=>{const o=ok[k.bron];if(!o)return;seen.add(o.id);
    Object.assign(k,{id:o.id,curve:o.curve,kA:o.kA,kabelType:o.kabelType,lengte:o.lengte,punten:o.punten,calc:o.calc});
    if(k.kabelBron==='standaard'&&o.kabel){k.kabel=o.kabel;if(o.kabelBron!=='standaard')delete k.kabelBron}})})});
 old.borden.forEach(ob=>{const b=fresh.borden.find(x=>x.kastId&&x.kastId===ob.kastId)||(!ob.kastId?null:fresh.borden[0]);
  if(!ob.kastId&&ob.groepen.some(g=>g.kringen.length)){fresh.borden.push(ob);return}
  if(!b)return;
  ob.groepen.forEach(og2=>og2.kringen.forEach(k=>{if(k.bron||seen.has(k.id))return;
   const g=b.groepen.find(x=>x.bron&&x.bron===og2.bron)||b.groepen.find(x=>!x.sub);delete k.code;g.kringen.push(k)}))});
 return fresh}
/* ---- CaCalc (project_cacalc_data.data.boards) ---- */
function calcKring(eg){const pol=eg.polen||'2P',n={ '1P':3,'2P':3,'1P+N':3,'3P':4,'3P+N':5,'4P':5}[pol]||3;
 return{A:+eg.In||'',curve:String(eg.curve||'C').replace(/-?curve/i,'').trim()||'C',polen:pol,kA:eg.icu===''||eg.icu==null?'':+eg.icu,kabelType:eg.mantel||'XVB',
  kabel:eg.sectie?`${n}G${String(eg.sectie).replace('.',',')}`:'',lengte:eg.lengte??''}}
function mergeCaCalc(st,calc){let n=0;const boards=(calc&&calc.boards)||[];
 st.borden.forEach(b=>{let cb=boards.find(x=>norm(x.naam)===norm(b.naam));
  if(!cb){const c=boards.filter(x=>(x.eindgroepen||[]).length);if(c.length===1&&st.borden.length===1)cb=c[0]}

function canvasToBg(cv){const max=1800,k=Math.min(1,max/Math.max(cv.width,cv.height)),c=document.createElement('canvas');c.width=Math.round(cv.width*k);c.height=Math.round(cv.height*k);

async function blobToBg(blob){

  if(!window.pdfjsLib){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.5.141/pdf.min.js');window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.5.141/pdf.worker.min.js'}
  const pdf=await window.pdfjsLib.getDocument({data:await blob.arrayBuffer()}).promise;let nr=1;
  if(pdf.numPages>1){nr=clamp(parseInt(await ask(`Deze PDF heeft ${pdf.numPages} pagina's. Welke pagina?`,'1'),10)||1,1,pdf.numPages)}
  const page=await pdf.getPage(nr),v0=page.getViewport({scale:1}),vp=page.getViewport({scale:1800/Math.max(v0.width,v0.height)}),cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;
  await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;return canvasToBg(cv)}

function svgPt(e){const s=$('#plan'),p=s.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(s.getScreenCTM().inverse());return[Math.round(q.x),Math.round(q.y)]}

function wallSnap(pl,x,y){let best=null,bd=16;pl.muren.forEach(m=>{const dx=m[2]-m[0],dy=m[3]-m[1],l2=dx*dx+dy*dy;if(!l2)return;const t=clamp(((x-m[0])*dx+(y-m[1])*dy)/l2,0,1),px=m[0]+t*dx,py=m[1]+t*dy,dd=Math.hypot(px-x,py-y);if(dd<bd){bd=dd;best=[Math.round(px),Math.round(py)]}});return best||[x,y]}

  if(g){const it=pl.items.find(i=>i.id===g.dataset.it);P.sel=it.id;P.drag={it,g,sx:x,sy:y,ox:it.x,oy:it.y,moved:false};g.setPointerCapture(e.pointerId);e.preventDefault()}
  else if(P.sel){P.sel=null;render()}}});

  $('#bproj').style.display='';this.status('Verbinden...');
  try{await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js');
   this.sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
   const{data}=await this.sb.auth.getSession();
   if(!data.session){this.status('Niet aangemeld');$('#v').innerHTML=`<div class="card"><h2>Aanmelden</h2><p>CaDraw gebruikt je aanmelding van CaSuite. Open eerst <a href="./index.html">CaSuite</a>, meld je daar aan en kom dan terug naar deze pagina.</p><button onclick="location.reload()">Opnieuw proberen</button></div>`;$('#tabs').innerHTML='';return}
   const u=data.session.user;this.who=((u.user_metadata&&(u.user_metadata.full_name||u.user_metadata.name||u.user_metadata.email))||u.email||'onbekend')+' (CaDraw)';
   const r=await this.sb.from('projecten').select('id,naam,projectnummer,klant,locatie,actief').order('naam');if(r.error)throw r.error;this.projecten=r.data||[];
   const want=new URLSearchParams(location.search).get('project')||(()=>{try{return localStorage.getItem('cadraw-project')}catch(e){return null}})();
   if(want&&this.projecten.some(p=>p.id===want))await this.open(want);else{this.status('');this.picker('')}
  }catch(err){this.status('Fout');$('#v').innerHTML=`<div class="card"><h2>Verbinding mislukt</h2><p>${esc(err.message||err)}</p><button onclick="location.reload()">Opnieuw proberen</button></div>`}},
 picker(q){const o=$('#ovl'),f=norm(q),list=this.projecten.filter(p=>p.actief!==false&&(!f||norm(p.naam+' '+(p.projectnummer||'')+' '+(p.klant||'')).includes(f)));
  const html=list.slice(0,80).map(p=>`<div class="pl" data-pid="${p.id}"><span><b>${esc(p.naam)}</b>${p.klant?'<br><small>'+esc(p.klant)+'</small>':''}</span><small>${esc(p.projectnummer||'')}</small></div>`).join('')||'<p class="note">Geen projecten gevonden.</p>';
  if($('#plist')){$('#plist').innerHTML=html;return}
  o.innerHTML=`<div class="card"><h2>Project kiezen<span style="flex:1"></span>${this.pid?'<button class="sm" data-a="closeOvl">Sluiten</button>':''}</h2><input id="pzoek" placeholder="Zoek op naam, nummer of klant" value="${esc(q)}"><div id="plist" style="margin-top:8px;max-height:60vh;overflow:auto">${html}</div></div>`;o.style.display='flex'},
 async open(pid){if(this.dirty)await this.save();$('#ovl').style.display='none';$('#ovl').innerHTML='';this.status('Laden...');
  try{const sb=this.sb,[own,dos,pls]=await Promise.all([sb.from('project_cadraw_data').select('*').eq('project_id',pid).maybeSingle(),sb.from('project_elektro_dossiers').select('*').eq('project_id',pid).maybeSingle(),sb.from('project_plannen').select('id,naam,afbeelding_url').eq('project_id',pid).order('created_at',{ascending:true})]);
   if(own.error)throw own.error;if(dos.error)throw dos.error;
   this.pid=pid;this.proj=this.projecten.find(p=>p.id===pid);this.plannen=(pls.data||[]).filter(p=>p.afbeelding_url);this.backup=false;
   try{localStorage.setItem('cadraw-project',pid)}catch(e){}
   let st=own.data&&own.data.data&&own.data.data.borden?migrate(own.data.data):null,nieuw=!st,msg='';
   if(dos.data&&dos.data.data&&dos.data.data.zekeringen){const fresh=fromCaDos(dos.data.data);delete fresh._over;st=st?keep(st,fresh):fresh}
   if(!st)st=blank();
   if(nieuw){const p=this.proj||{};st.project.naam=st.project.naam||p.naam||'';st.project.adres=st.project.adres||p.locatie||'';st.project.klant=st.project.klant||p.klant||'';
    const c=await sb.from('project_cacalc_data').select('data').eq('project_id',pid).maybeSingle();
    if(c.data&&c.data.data){if(allK(st))msg=' - er is ook een CaCalc-berekening (knop "Aanvullen uit CaCalc" onder Document)';else{try{const f=fromCaCalc(c.data.data);f.project=st.project;f.plannen=st.plannen;st=f;msg=', opgebouwd uit CaCalc'}catch(e){}}}
    msg=(dos.data?'Opgebouwd uit CaDos':'Nieuw CaDraw-dossier')+msg}
   S=st;bi=0;P.pi=0;P.sel=null;undoStack=[];E.sel=null;this.dirty=false;$('#bproj').textContent=(this.proj?this.proj.naam:'Project')+' ▾';this.status(nieuw?'Nog niet bewaard':'Geladen');render();
   if(msg)toast(msg);
  }catch(err){this.status('Fout');toast('Laden mislukt: '+(err.message||err))}},
 async save(){if(!this.pid||this.saving)return;this.saving=true;clearTimeout(this.t);this.dirty=false;this.status('Bewaren...');
  try{const nu=new Date().toISOString(),r=await this.sb.from('project_cadraw_data').upsert({project_id:this.pid,data:S,updated_at:nu,bijgewerkt_door:this.who},{onConflict:'project_id'}).select('id');
   if(r.error)throw r.error;if(!r.data||!r.data.length)throw new Error('geen rij bewaard (rechten?)');
   const n=await this.push();this.status('Bewaard '+new Date().toLocaleTimeString('nl-BE',{hour:'2-digit',minute:'2-digit'})+(n?` · ${n} waarden naar CaDos`:''));
  }catch(err){this.dirty=true;this.status('Niet bewaard!');toast('Bewaren mislukt: '+(err.message||err))}
  this.saving=false;if(this.dirty){clearTimeout(this.t);this.t=setTimeout(()=>this.save(),4000)}},
 /* schrijft gewijzigde waarden van gekoppelde automaten/differentielen terug in het CaDos-dossier */
 async push(tries=0){const sb=this.sb,q=await sb.from('project_elektro_dossiers').select('*').eq('project_id',this.pid).maybeSingle();if(q.error||!q.data||!q.data.data||!q.data.data.zekeringen)return 0;
  const row=q.data,d=JSON.parse(JSON.stringify(row.data)),byId={},rowOf={},kastOf={};
  d.zekeringen.kasten.forEach(k=>(k.rijen||[]).forEach(r=>(r.items||[]).forEach(it=>{byId[it.id]=it;rowOf[it.id]=r;kastOf[it.id]=k})));
  let n=0;const AO=["2A","4A","6A","10A","13A","16A","20A","25A","32A","40A","50A","63A","80A","100A","125A"],MO=["10mA","30mA","100mA","300mA"],PN={'1P':1,'2P':2,'3P':3,'4P':4};
  const set=(o,k,v)=>{if(JSON.stringify(o[k]??null)!==JSON.stringify(v??null)){o[k]=v;n++}};
  const polen=(it,p)=>{if(!PN[p]||it.polen===p)return;const r=rowOf[it.id],maat=+kastOf[it.id].maat||0,som=(r.items||[]).reduce((a,x)=>a+(+x.breedte||0),0),nb=PN[p],ob=+it.breedte||0;
   if(PN[it.polen]===ob){if(maat&&som-ob+nb>maat)return;it.breedte=nb}it.polen=p;n++};
  const diff=(it,h)=>{if(!it||it.categorie!=='Differentieel')return;if(MO.includes(h.mA+'mA'))set(it,'mA',h.mA+'mA');if(AO.includes(h.A+'A'))set(it,'A',h.A+'A');polen(it,h.polen);set(it,'cadraw',{type:h.type})};
  S.borden.forEach(b=>{diff(byId[b.hoofd.bron],b.hoofd);b.groepen.forEach(g=>{if(g.sub)diff(byId[g.bron],g);
   g.kringen.forEach(k=>{const it=byId[k.bron];if(!it||it.categorie!=='Automaat')return;
    set(it,'naam',k.naam||'');if(AO.includes(k.A+'A'))set(it,'A',k.A+'A');polen(it,k.polen);
    if((it.kabelOpKlemmen||it.kabelType)&&k.kabel&&kabFmt(it.kabelType)!==kabFmt(k.kabel))set(it,'kabelType',k.kabel);
    set(it,'cadraw',{curve:k.curve,kA:k.kA,mantel:k.kabelType,kabel:k.kabel,lengte:k.lengte,punten:k.punten.map(p=>({id:p.id,type:p.type,aantal:p.aantal,tekst:p.tekst,hw:!!p.hw}))})})})});
  if(!n)return 0;
  if(!this.backup){const bk=await sb.from('dossier_backups').insert({dossier_id:row.id,data:row.data,reden:'CaDraw: voor terugschrijven'});if(bk.error)throw new Error('back-up van CaDos-dossier mislukt, niets teruggeschreven: '+bk.error.message);this.backup=true}
  const u=await sb.from('project_elektro_dossiers').update({data:d,updated_at:new Date().toISOString(),bijgewerkt_door:this.who}).eq('id',row.id).eq('updated_at',row.updated_at).select('id');
  if(u.error)throw u.error;if(!u.data||!u.data.length){if(tries<2)return this.push(tries+1);throw new Error('CaDos-dossier werd intussen elders gewijzigd; terugschrijven overgeslagen')}
  return n},
 async resync(){if(this.dirty)await this.save();await this.open(this.pid);toast('CaDos opnieuw ingelezen')},
 async calc(){try{const c=await this.sb.from('project_cacalc_data').select('data').eq('project_id',this.pid).maybeSingle();if(!c.data||!c.data.data){toast('Dit project heeft geen CaCalc-berekening.');return}
  snap();const n=mergeCaCalc(S,c.data.data);persist();render();toast(n?`${n} kringen aangevuld uit CaCalc (koppeling op naam)`:'Geen kringen met dezelfde naam gevonden in CaCalc',!!n)}catch(err){toast('CaCalc lezen mislukt: '+(err.message||err))}}
};
const allK=st=>st.borden.reduce((n,b)=>n+b.groepen.reduce((m,g)=>m+g.kringen.length,0),0);
window.addEventListener('beforeunload',e=>{if(CLOUD&&cloud.dirty){cloud.save();e.preventDefault();e.returnValue=''}});
document.addEventListener('visibilitychange',()=>{if(CLOUD&&document.hidden&&cloud.dirty)cloud.save()});
if(CLOUD)cloud.init();else render();
</script>

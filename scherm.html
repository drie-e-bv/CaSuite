<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CaSuite — Planningsbord</title>
<!--
  scherm.html -- Ronde 67 (2026-10-03), op vraag van Peter: "Kunnen we een 'enkel weergave'
  scherm/layout webpagina maken van de planning vanaf de huidige week? om op een scherm weer te
  geven" -- bedoeld om op een vast scherm op kantoor te laten draaien (bv. een wandscherm).
  Herwerkt in RONDE 68 (2026-10-03), op vraag van Peter: "Scherm mag meer in de vorm van het
  rooster zijn ... het mag in feite maar 1 pagina scherm zijn waarop niet gescrolt kan worden.
  Enkel weergave van zo veel mogelijk info" -- de vroegere verticale lijst van dag-kaarten is
  vervangen door een rooster-matrix (dagen als rijen, personen als kolommen, net als het echte
  Personeelsplanning-rooster in de hoofdapp), die altijd exact in het scherm past: geen enkele
  scrollbalk, de rij-/kolombreedtes en lettergrootte passen zich automatisch aan het aantal dagen/
  personen aan (zie scaleSchermGrid()/fitChipRow() hieronder). Peter meldde ook dat de weergave
  zich niet leek aan te passen aan de gekozen rollen op Bedrijfsgegevens -- bleek geen echte bug in
  dit bestand (het filter hieronder werkte altijd al correct), maar dat die instelling voorheen
  enkel via de grote, niet-gerelateerde "Bedrijfsgegevens opslaan"-knop bewaard werd; die kaart
  heeft nu een eigen "Toepassen"-knop die meteen bewaart (zie src2.html, #btn-scherm-toepassen).

  Bewust een VOLLEDIG LOSSTAANDE pagina, niet via build-apps.js uit src2.html gegenereerd zoals
  index.html/werf.html/planning.html/cados.html/cacalc.html: dit is geen tabblad van de normale,
  aanmeld-vereisende app, maar een eigen, publieke, niet-aanmeld-pagina. Peter's expliciete keuze
  (via AskUserQuestion, "Geen login nodig (vaste link)"): wie de link kent kan de planning zien --
  "geen gevoelige data zoals lonen" stond toch al nooit in deze app.

  BEVEILIGING: de Supabase-anoniem-sleutel hieronder is sowieso altijd publiek leesbaar (staat
  ook gewoon in de broncode van index.html) -- de ECHTE poort is het geheime "scherm_token" (zie
  de ?token=-parameter in de URL), gecontroleerd door de scherm_data()-databankfunctie (security
  definer, SQL-migratie "scherm_weergave_planningsbord"). Die functie bypasst RLS bewust zelf en
  geeft bij een foutief/ontbrekend token altijd gewoon `null` terug (geen onderscheid tussen "fout
  token" en "geen token", zodat niets te raden/verklappen valt). Bedrijfsgegevens -> "Schermweergave
  (planningsbord)" toont/genereert de link; een nieuwe code maakt de vorige onmiddellijk ongeldig.

  Toont, zoals gevraagd: vandaag bovenaan (als eerste rij, geaccentueerd), de volgende dagen
  (instelbaar aantal, zie "scherm_dagen") daaronder; schakelt om 00u00 automatisch door naar de
  volgende dag; en herlaadt de gegevens elke paar minuten automatisch (zie SCHERM_REFRESH_MS
  hieronder) zodat een wijziging in de planning vanzelf op het scherm verschijnt zonder dat iemand
  moet ingrijpen.

  RONDE "scherm-gemeente" (2026-10-09), op vraag van Peter: "de gemeente waari[n] het project is
  (als dat geweten is)" erbij tonen op elke projectchip. Geen apart "gemeente"-veld in de databank
  -- hergebruikt het bestaande vrije-tekst "Locatie"-veld van het project (zie saveProjectRow()/
  #f-locatie in de hoofdapp, dat veld bevat bij de meeste projecten toch al gewoon een plaatsnaam).
  Bij een volledig adres (komma erin) wordt enkel het stuk NA de laatste komma gebruikt als
  gemeente. Vraagt ook een SQL-wijziging: scherm_data() gaf voorheen enkel `id`/`naam` per project
  mee, nu ook `locatie` (rechtstreeks in Supabase aangepast en geverifieerd, geen nieuwe security-
  waarschuwingen via get_advisors).

  RONDE "scherm-max8" (2026-10-09), op vraag van Peter (met screenshot van 15 personen in 1,
  onleesbaar smalle rij): "Kun je de planning op het scherm verdelen in max 8 personen op een rij?
  [...] bedoeling is echt dat de medewerkers in 1 oogopslag bij binnenkomst direct zien waar ze
  heen moeten. bij het vak van de planning project op 1 rij, eronder de gemeente. mss ook nog de
  projectleider van het project." Twee aparte wijzigingen:
  1) MAX_PERSONEN_PER_RIJ (8): `mensen` wordt in groepen van max 8 gehakt; elke groep krijgt zijn
     eigen volledige mini-rooster (kopregel + alle dagrijen), gestapeld onder elkaar in
     #scherm-content. Bij <=8 personen (het gewone geval) blijft dit exact 1 groep, dus visueel
     identiek aan voorheen. scaleSchermGrid() is herwerkt om per groep te werken (elke groep krijgt,
     via CSS flexbox, een gelijk deel van de beschikbare hoogte) i.p.v. uit te gaan van 1 vast
     #scherm-grid-element.
  2) Projectchip toont nu, als dat aan staat (zie scherm_toon_gemeente/scherm_toon_projectleider
     hieronder), de projectnaam/gemeente/projectleider elk op een eigen regel i.p.v. achter elkaar op
     1 afgekapte regel (".scherm-chip-detailed") -- enkel bij een echte projecttoewijzing, niet bij
     Verlof/Keuring/vrije taak.
  Ook een nieuwe SQL-wijziging: `projecten` geeft nu ook `projectleider_naam` mee, en `bedrijf`
  kreeg 2 nieuwe kolommen (`scherm_toon_gemeente`/`scherm_toon_projectleider`, beide default true) --
  instelbaar via 2 nieuwe vinkjes bij Bedrijfsgegevens -> "Schermweergave (planningsbord)" (op
  Peters vraag naar zelf aan/uit te vinken velden). Enkel deze 2 velden zijn nu instelbaar; verdere
  velden kunnen later op dezelfde manier toegevoegd worden zodra daar vraag naar is.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=Figtree:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root{
    --ink:#15241c; --ink-soft:#5b6b62; --ink-faint:#8a988f;
    --bg:#f2f5f3; --card:#ffffff; --line:#dde5e0; --line-strong:#c7d2cb;
    --brand:#1b6b3e; --brand-strong:#135230; --brand-soft:#e5f1e9;
    --font-display:"Archivo","Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-ui:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-mono:"JetBrains Mono","SF Mono",Consolas,Menlo,"Liberation Mono",monospace;
    /* Statuskleuren -- exact dezelfde waarden als #tab-inzet/#ip-panel in de hoofdapp (ronde 60),
       zodat dit scherm visueel overeenkomt met het rooster dat iedereen al kent. */
    --st-verlof-bg:#eef6f0; --st-verlof:#5c8f6f;
    --st-adv-bg:#f1eef9; --st-adv:#8a79b8;
    --st-ziek-bg:#f8eeec; --st-ziek:#b08078;
    --st-recup-bg:#e9f5f6; --st-recup:#4f9499;
    --st-afwezig-bg:#f1efe9; --st-afwezig:#8c8a7e;
    --st-magazijn-bg:#f6efe0; --st-magazijn:#a4874e;
    --st-keuring-bg:#d93025; --st-keuring:#fff;
    /* Dynamisch bijgestelde lettergroottes -- zie scaleSchermGrid() (RONDE 68). */
    --scherm-name-fs: 13px;
    --scherm-chip-fs: 11px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);}
  /* RONDE 68: nooit scrollen -- alles moet in 1 schermvullende pagina passen. */
  html,body{height:100%;overflow:hidden;}
  body{display:flex;flex-direction:column;padding:16px 22px 14px;gap:10px;}
  h1,h2,h3{font-family:var(--font-display);font-stretch:110%;letter-spacing:-.005em;margin:0;color:var(--ink);}

  .scherm-header{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:20px;}
  .scherm-brand{display:flex;align-items:center;gap:10px;min-width:0;}
  .scherm-brand-dot{width:12px;height:12px;border-radius:50%;background:var(--brand);flex:0 0 auto;}
  .scherm-brand-naam{font-family:var(--font-display);font-weight:800;font-stretch:112%;color:var(--brand-strong);font-size:1.25rem;letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .scherm-meta{display:flex;align-items:baseline;gap:14px;flex:0 0 auto;}
  .scherm-scope-note{font-size:.78rem;color:var(--ink-faint);}
  .scherm-clock{font-family:var(--font-mono);font-size:1.15rem;color:var(--ink-soft);text-align:right;white-space:nowrap;}
  .scherm-clock .scherm-refresh-note{display:block;font-size:.68rem;color:var(--ink-faint);margin-top:1px;font-family:var(--font-ui);}

  /* ===== Rooster-matrix (RONDE 68): dagen als rijen, personen als kolommen -- zelfde indeling als
     table.ip-grid in de hoofdapp. Een CSS-grid i.p.v. een <table>, omdat de rijhoogtes gelijk
     verdeeld moeten worden over de resterende schermhoogte (1fr per dag), wat met gewone
     tabelrijen niet betrouwbaar lukt. Kolom-/rijaantal + afmetingen worden in JS opgebouwd
     (renderScherm()), want "repeat(N, 1fr)" vraagt een letterlijk getal, geen CSS-variabele. ===== */
  #scherm-content{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;}
  .scherm-grid-outer{flex:1 1 auto;min-height:0;border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden;}
  .scherm-grid{height:100%;display:grid;}
  /* Ronde "scherm-max8" (2026-10-09), op vraag van Peter: "verdelen in max 8 personen op een rij"
     -- bij meer dan MAX_PERSONEN_PER_RIJ (zie script) personen wordt er niet 1 brede grid meer
     getekend, maar meerdere, elk met max 8 personen-kolommen, gestapeld onder elkaar. Bij <=8
     personen (het gewone geval) blijft dit exact 1 groep en dus visueel ongewijzigd t.o.v.
     voorheen -- deze .multi-regels komen dan simpelweg niet in het spel. */
  .scherm-grid-outer.scherm-grid-outer-multi{display:flex;flex-direction:column;gap:5px;border:none;background:none;border-radius:0;overflow:visible;}
  .scherm-grid-outer-multi .scherm-grid{height:auto;flex:1 1 0;min-height:0;border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden;}
  .scherm-cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:3px 7px;overflow:hidden;display:flex;flex-direction:column;min-width:0;min-height:0;}
  .scherm-grid > .scherm-cell:nth-last-child(-n+1000){} /* no-op hook, kolom-/rij-randjes blijven gewoon overal staan -- rustiger dan per-laatste-kolom uitzonderingen */

  .scherm-head-cell{background:var(--bg);justify-content:center;position:sticky;top:0;}
  .scherm-head-cell .scherm-pname{font-family:var(--font-display);font-weight:700;font-size:var(--scherm-name-fs);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .scherm-head-cell .scherm-prol{font-size:calc(var(--scherm-name-fs) * .68);color:var(--ink-faint);font-weight:500;text-transform:uppercase;letter-spacing:.03em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .scherm-head-corner{background:var(--bg);}

  .scherm-date-cell{background:var(--bg);justify-content:center;gap:1px;}
  .scherm-date-cell .scherm-dow{font-size:calc(var(--scherm-name-fs) * .72);color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;font-weight:600;}
  .scherm-date-cell .scherm-datenum{font-family:var(--font-display);font-size:var(--scherm-name-fs);font-weight:700;color:var(--ink);}
  .scherm-date-cell .scherm-vandaag-badge{display:inline-block;font-size:calc(var(--scherm-name-fs) * .62);font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#fff;background:var(--brand);border-radius:20px;padding:1px 7px;margin-top:1px;width:fit-content;}

  .scherm-row-today .scherm-date-cell{background:var(--brand-soft);box-shadow:inset 3px 0 0 var(--brand);}
  .scherm-row-today .scherm-date-cell .scherm-datenum{color:var(--brand-strong);}
  .scherm-row-today.scherm-slot{box-shadow:inset 0 0 0 1px var(--brand-soft);}
  .scherm-row-weekend .scherm-date-cell, .scherm-row-weekend.scherm-slot{background:#eef2ef;}
  .scherm-row-weekend.scherm-slot.scherm-row-today{background:#e3f0e8;}

  .scherm-chiprow{display:flex;flex-wrap:wrap;align-content:flex-start;gap:2px 4px;overflow:hidden;flex:1 1 auto;min-height:0;}
  .scherm-chip{font-size:var(--scherm-chip-fs);padding:1px 6px;border-radius:6px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .scherm-chip.project{background:var(--brand-soft);color:var(--brand-strong);}
  /* Ronde "scherm-max8" (2026-10-09, op vraag van Peter: "project op 1 rij, eronder de gemeente,
     mss ook nog de projectleider") -- vervangt de ronde-"scherm-gemeente"-opzet (gemeente als
     inline-achtervoegsel op dezelfde regel) door een echte meerregelige kaart binnen de chip:
     projectnaam bovenaan (vet), gemeente/projectleider elk op hun eigen, iets lichtere regel
     eronder. Enkel voor chips die effectief iets extra's tonen (scherm_toon_gemeente/
     scherm_toon_projectleider aan + de waarde is gekend) -- een gewone chip zonder die info blijft
     gewoon de oude, compacte 1-regelige stijl (zie .scherm-chip hierboven). */
  .scherm-chip.scherm-chip-detailed{display:flex;flex-direction:column;align-items:flex-start;white-space:normal;gap:0;padding:3px 7px;}
  .scherm-chip-naam{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;}
  .scherm-chip-sub{display:block;font-weight:500;opacity:.72;font-size:.84em;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;}
  .scherm-chip-sub.scherm-chip-leider{opacity:.82;}
  .scherm-chip.vrij{background:#eef0f1;color:var(--ink-soft);font-style:italic;}
  .scherm-chip.verlof{background:var(--st-verlof-bg);color:var(--st-verlof);}
  .scherm-chip.adv{background:var(--st-adv-bg);color:var(--st-adv);}
  .scherm-chip.ziek{background:var(--st-ziek-bg);color:var(--st-ziek);}
  .scherm-chip.recup{background:var(--st-recup-bg);color:var(--st-recup);}
  .scherm-chip.afwezig{background:var(--st-afwezig-bg);color:var(--st-afwezig);}
  .scherm-chip.magazijn{background:var(--st-magazijn-bg);color:var(--st-magazijn);}
  .scherm-chip.keuring{background:var(--st-keuring-bg);color:var(--st-keuring);font-weight:700;}
  .scherm-chip-more{font-size:var(--scherm-chip-fs);padding:1px 6px;border-radius:6px;background:var(--line-strong);color:var(--ink-soft);font-weight:700;flex:0 0 auto;}
  .scherm-empty-slot{color:var(--ink-faint);font-size:var(--scherm-chip-fs);}

  .scherm-buitendienst{background:repeating-linear-gradient(135deg, #eef1ee, #eef1ee 7px, #e3e8e3 7px, #e3e8e3 14px);}
  .scherm-buitendienst .scherm-chip-mini{color:var(--ink-faint);font-size:var(--scherm-chip-fs);font-style:italic;}

  .scherm-state{max-width:640px;margin:14vh auto;text-align:center;}
  .scherm-state h1{font-size:1.6rem;margin-bottom:12px;}
  .scherm-state p{color:var(--ink-soft);font-size:1.05rem;line-height:1.5;}
  .scherm-empty-grid{flex:1 1 auto;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--ink-faint);font-size:1rem;padding:0 24px;}
  .scherm-errorbar{position:fixed;left:0;right:0;bottom:0;background:#b8402f;color:#fff;text-align:center;padding:8px;font-size:.85rem;display:none;z-index:5;}

  @media (max-width: 760px){
    body{padding:12px 12px 40px;overflow:auto;height:auto;min-height:100vh;}
    html{overflow:auto;height:auto;}
    .scherm-grid-outer{min-height:70vh;}
    .scherm-header{flex-wrap:wrap;}
  }
</style>
</head>
<body>

  <div class="scherm-header">
    <div class="scherm-brand"><span class="scherm-brand-dot" aria-hidden="true"></span><span class="scherm-brand-naam" id="scherm-bedrijfsnaam">CaSuite</span></div>
    <div class="scherm-meta">
      <span class="scherm-scope-note" id="scherm-scope-note"></span>
      <div class="scherm-clock"><span id="scherm-klok">--:--</span><span class="scherm-refresh-note" id="scherm-refresh-note">bezig met laden…</span></div>
    </div>
  </div>

  <div id="scherm-content"></div>
  <div class="scherm-errorbar" id="scherm-errorbar"></div>

<script>
(function(){
  // Zelfde Supabase-project/anoniem-sleutel als de rest van de CaSuite-apps (zie index.html) --
  // deze sleutel is op zichzelf nooit het geheim, zie de toelichting in de <!--comment--> hierboven.
  const SUPABASE_URL = 'https://eownpxplsnqbghcggugs.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVvd25weHBsc25xYmdoY2dndWdzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMDg1MDcsImV4cCI6MjEwMjY4NDUwN30.KmzypFOwMvH5Rf_AK9EGDt2593vrqHn1UR-WSiURXZs';
  // Hoe vaak de gegevens zelf opnieuw opgehaald worden (Peter koos "elke paar minuten automatisch").
  const SCHERM_REFRESH_MS = 3 * 60 * 1000;
  // RONDE 68: breedte van de vaste datumkolom links, zelfde idee als .ip-th-date in de hoofdapp.
  const DATE_COL_W = 92;
  // RONDE scherm-max8: max. aantal personen naast elkaar in 1 rij-groep; meer personen -> extra gestapelde groepen.
  const MAX_PERSONEN_PER_RIJ = 8;

  const IP_STATUSES = {
    VERLOF: { label: 'Verlof', cls: 'verlof' },
    ADV: { label: 'ADV', cls: 'adv' },
    ZIEK: { label: 'Ziek', cls: 'ziek' },
    RECUP: { label: 'Recup', cls: 'recup' },
    AFWEZIG: { label: 'Afwezig', cls: 'afwezig' },
    MAGAZIJN: { label: 'Magazijn', cls: 'magazijn' },
    KEURING: { label: 'Keuring', cls: 'keuring' }
  };
  const WEEKDAGEN = ['zo','ma','di','wo','do','vr','za'];
  const MAANDEN_KORT = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];

  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function isoVandaag(){
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function addDagen(iso, n){
    const d = new Date(iso + 'T00:00:00');
    d.setDate(d.getDate() + n);
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function datumLabel(iso){
    const d = new Date(iso + 'T00:00:00');
    return { weekdag: WEEKDAGEN[d.getDay()], datumTekst: d.getDate() + ' ' + MAANDEN_KORT[d.getMonth()], isWeekend: d.getDay() === 0 || d.getDay() === 6 };
  }

  const params = new URLSearchParams(location.search);
  const token = params.get('token');
  const content = document.getElementById('scherm-content');
  const refreshNote = document.getElementById('scherm-refresh-note');
  const errorbar = document.getElementById('scherm-errorbar');

  function toonState(titel, tekst){
    content.innerHTML = '<div class="scherm-state"><h1>' + escapeHtml(titel) + '</h1><p>' + escapeHtml(tekst) + '</p></div>';
  }

  if(!token){
    toonState('Geen link-code gevonden', 'Deze pagina heeft een geldige ?token=-link nodig. Haal de volledige link op via Bedrijfsgegevens → "Schermweergave (planningsbord)".');
    refreshNote.textContent = '';
  } else {
    laadEnToon();
    setInterval(laadEnToon, SCHERM_REFRESH_MS);
    planMiddernachtVerversing();
    // Eens per nacht een volledige pagina-herlaad (i.p.v. enkel de gegevens) -- vangt ook een
    // nieuwe upload van dit bestand zelf op, voor een scherm dat soms wekenlang niet afgesloten
    // wordt. Rustig tijdstip gekozen (03u17, een beetje willekeurig zodat niet elk scherm precies
    // tegelijk herlaadt als er ooit meerdere draaien).
    planNachtelijkeHerlaad();
    // RONDE 68: bij een venster-/schermformaatwijziging de rooster-matrix herschalen (lettergrootte
    // + de "+N"-overflow per cel) zonder een nieuwe databankbevraging nodig te hebben -- de laatst
    // opgehaalde data staat al klaar in laatsteSchermData hieronder.
    let resizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => { if(laatsteSchermData) renderScherm(laatsteSchermData); }, 150);
    });
  }

  function planMiddernachtVerversing(){
    const nu = new Date();
    const morgen = new Date(nu.getFullYear(), nu.getMonth(), nu.getDate() + 1, 0, 0, 5);
    setTimeout(() => { laadEnToon(); planMiddernachtVerversing(); }, morgen - nu);
  }
  function planNachtelijkeHerlaad(){
    const nu = new Date();
    const volgende = new Date(nu.getFullYear(), nu.getMonth(), nu.getDate(), 3, 17, 0);
    if(volgende <= nu) volgende.setDate(volgende.getDate() + 1);
    setTimeout(() => location.reload(), volgende - nu);
  }

  let laatsteSchermData = null;

  async function laadEnToon(){
    try{
      const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/scherm_data', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY },
        body: JSON.stringify({ p_token: token })
      });
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if(data == null){
        toonState('Ongeldige of verlopen link', 'Deze link werkt niet (meer) -- waarschijnlijk is er een nieuwe aangemaakt. Vraag de actuele link via Bedrijfsgegevens → "Schermweergave (planningsbord)".');
        refreshNote.textContent = '';
        return;
      }
      errorbar.style.display = 'none';
      laatsteSchermData = data;
      renderScherm(data);
      refreshNote.textContent = 'laatst bijgewerkt om ' + new Date().toLocaleTimeString('nl-BE', { hour:'2-digit', minute:'2-digit' });
      if(data.bedrijf_naam) document.getElementById('scherm-bedrijfsnaam').textContent = data.bedrijf_naam;
    }catch(err){
      // Bewust de laatst geslaagde weergave laten staan (geen lege/foutpagina) -- enkel een kleine
      // balk onderaan, want dit scherm draait onbemand en moet zo veel mogelijk blijven tonen wat
      // het al had, ook bij een kort netwerkhaperinkje.
      errorbar.style.display = 'block';
      errorbar.textContent = 'Kan de planning niet verversen (verbindingsprobleem) -- blijft de laatst gekende stand tonen. Nieuwe poging binnen enkele minuten.';
      if(!content.innerHTML) toonState('Kan niet verbinden', 'Geen verbinding met de databank. Wordt automatisch opnieuw geprobeerd.');
    }
  }

  function persoonIsActief(p, dateISO){
    if(p.planning_actief === false) return false;
    if(p.in_dienst_vanaf && dateISO < p.in_dienst_vanaf) return false;
    if(p.uit_dienst_vanaf && dateISO > p.uit_dienst_vanaf) return false;
    return true;
  }

  // ===== RONDE 68: rooster-matrix -- dagen als rijen, personen als vaste kolommen (dezelfde
  // personenlijst voor elke rij; buiten-dienst wordt per cel getoond, niet door de kolom zelf te
  // laten verdwijnen -- zelfde gedrag als table.ip-grid in de hoofdapp). =====
  function renderScherm(data){
    const rollenFilter = new Set(data.scherm_rollen || []);
    // Permanent inactieve mensen (planning_actief:false) nooit als kolom tonen -- zou enkel een
    // kolom vol grijze "buiten dienst"-cellen opleveren, wat tegen "zoveel mogelijk info op 1
    // scherm" ingaat. Tijdelijk buiten dienst (in_dienst_vanaf/uit_dienst_vanaf) blijft wel een
    // vaste kolom -- dat wordt per cel getoond via persoonIsActief() verder hieronder, net als in
    // table.ip-grid (renderIpGrid()) in de hoofdapp.
    let mensen = [].concat(data.team_leden || [], data.bureau || [])
      .filter(p => p.planning_actief !== false && (!rollenFilter.size || rollenFilter.has(p.rol || 'Technieker')));
    mensen.sort((a, b) => {
      const va = (a.volgorde == null || a.volgorde === '' || isNaN(a.volgorde)) ? Infinity : Number(a.volgorde);
      const vb = (b.volgorde == null || b.volgorde === '' || isNaN(b.volgorde)) ? Infinity : Number(b.volgorde);
      return va - vb;
    });

    const scopeNote = (rollenFilter.size ? Array.from(rollenFilter).join(', ') : 'alle rollen');
    document.getElementById('scherm-scope-note').textContent = mensen.length + ' personen — ' + scopeNote;

    if(!mensen.length){
      content.innerHTML = '<div class="scherm-grid-outer"><div class="scherm-empty-grid">Geen personen te tonen voor de gekozen rollen.<br>Pas de rolkeuze aan bij Bedrijfsgegevens → "Schermweergave (planningsbord)" en klik op "Toepassen".</div></div>';
      return;
    }

    const projectNaamById = {};
    const projectGemeenteById = {};
    const projectLeiderById = {};
    (data.projecten || []).forEach(p => {
      projectNaamById[String(p.id)] = p.naam;
      // Ronde "scherm-gemeente" (2026-10-09), op vraag van Peter: "de gemeente waarin het project
      // is (als dat geweten is)" erbij tonen. Geen apart "gemeente"-veld in de databank -- hergebruikt
      // het bestaande vrije-tekst "Locatie"-veld van het project (zie saveProjectRow()/#f-locatie in
      // de hoofdapp). Meeste projecten hebben daar gewoon een plaatsnaam staan ("Aalter", "Knokke",
      // ...), maar een enkele heeft een volledig adres ("Tortellaan 5, Knokke") -- bij een komma
      // wordt daarom enkel het stuk NA de laatste komma gebruikt (de gemeente, niet de straat).
      // Leeg/onbekend blijft gewoon leeg, exact zoals gevraagd ("als dat geweten is").
      const loc = (p.locatie || '').trim();
      const idx = loc.lastIndexOf(',');
      projectGemeenteById[String(p.id)] = (idx === -1 ? loc : loc.slice(idx + 1).trim());
      // Ronde "scherm-max8" (2026-10-09), op vraag van Peter: "mss ook nog de projectleider van het
      // project" -- rechtstreeks het bestaande `projectleider_naam`-veld van het project.
      projectLeiderById[String(p.id)] = (p.projectleider_naam || '').trim();
    });
    // Beide standaard AAN (coalesce gebeurt ook al in scherm_data() zelf, maar defensief ook hier
    // -- bv. voor een oudere/afwijkende respons zonder deze 2 velden).
    const toonGemeente = data.scherm_toon_gemeente !== false;
    const toonProjectleider = data.scherm_toon_projectleider !== false;
    const itemsPerPersoonEnDag = {};
    (data.planning_items || []).forEach(it => {
      const k = it.persoon_naam + '|' + it.datum;
      (itemsPerPersoonEnDag[k] = itemsPerPersoonEnDag[k] || []).push(it);
    });

    const vandaag = data.vandaag || isoVandaag();
    const aantalDagen = Math.max(1, data.scherm_dagen || 5);

    // ---- Ronde "scherm-max8": personen in groepen van max MAX_PERSONEN_PER_RIJ -- elke groep
    //      krijgt zo meteen bredere kolommen i.p.v. steeds smallere kolommen bij meer personen. ----
    const groepen = [];
    for(let i = 0; i < mensen.length; i += MAX_PERSONEN_PER_RIJ) groepen.push(mensen.slice(i, i + MAX_PERSONEN_PER_RIJ));

    function bouwGroepCellsHtml(groep){
      // ---- Kopregel (personen van deze groep) ----
      let html = '<div class="scherm-cell scherm-head-cell scherm-head-corner"></div>';
      groep.forEach(p => {
        html += '<div class="scherm-cell scherm-head-cell" title="' + escapeHtml(p.naam) + (p.rol ? ' — ' + escapeHtml(p.rol) : '') + '">'
          + '<span class="scherm-pname">' + escapeHtml(p.naam) + '</span>'
          + '<span class="scherm-prol">' + escapeHtml(p.rol || 'Technieker') + '</span>'
          + '</div>';
      });
      // ---- Dagrijen (dezelfde dagen voor elke groep) ----
      for(let i = 0; i < aantalDagen; i++){
        const dateISO = addDagen(vandaag, i);
        const isVandaag = i === 0;
        const { weekdag, datumTekst, isWeekend } = datumLabel(dateISO);
        const rowCls = (isVandaag ? ' scherm-row-today' : '') + (isWeekend ? ' scherm-row-weekend' : '');

        html += '<div class="scherm-cell scherm-date-cell' + rowCls + '">'
          + '<span class="scherm-dow">' + escapeHtml(weekdag) + '</span>'
          + '<span class="scherm-datenum">' + escapeHtml(datumTekst) + '</span>'
          + (isVandaag ? '<span class="scherm-vandaag-badge">Vandaag</span>' : '')
          + '</div>';

        groep.forEach(p => {
          if(!persoonIsActief(p, dateISO)){
            const reden = (p.in_dienst_vanaf && dateISO < p.in_dienst_vanaf) ? 'Nog niet in dienst' : 'Uit dienst';
            html += '<div class="scherm-cell scherm-slot scherm-buitendienst' + rowCls + '" title="' + escapeHtml(reden) + '"><span class="scherm-chip-mini">' + escapeHtml(reden) + '</span></div>';
            return;
          }
          const items = itemsPerPersoonEnDag[p.naam + '|' + dateISO] || [];
          if(!items.length){
            html += '<div class="scherm-cell scherm-slot' + rowCls + '"><span class="scherm-empty-slot">—</span></div>';
          } else {
            html += '<div class="scherm-cell scherm-slot' + rowCls + '"><div class="scherm-chiprow">' + items.map(it => chipHtml(it, projectNaamById, projectGemeenteById, projectLeiderById, toonGemeente, toonProjectleider)).join('') + '</div></div>';
          }
        });
      }
      return html;
    }

    const isMulti = groepen.length > 1;
    const groepenHtml = groepen.map((groep, gi) =>
      '<div class="scherm-grid" id="scherm-grid-' + gi + '" style="grid-template-columns:' + DATE_COL_W + 'px repeat(' + groep.length + ', 1fr);grid-template-rows:auto repeat(' + aantalDagen + ', 1fr);">' + bouwGroepCellsHtml(groep) + '</div>'
    ).join('');
    content.innerHTML = '<div class="scherm-grid-outer' + (isMulti ? ' scherm-grid-outer-multi' : '') + '">' + groepenHtml + '</div>';

    // Lettergrootte + overflow-afkap pas berekenen NA dat elke groep-grid echt getekend is (anders
    // zijn clientHeight/clientWidth hieronder nog 0). requestAnimationFrame wacht op die eerste
    // tekenbeurt. Elke groep krijgt zijn EIGEN schaalberekening (eigen kolomaantal, en bij meerdere
    // groepen ook een kleiner aandeel van de schermhoogte, zie .scherm-grid-outer-multi in de CSS).
    requestAnimationFrame(() => {
      groepen.forEach((groep, gi) => scaleSchermGrid(document.getElementById('scherm-grid-' + gi), groep.length, aantalDagen));
      document.querySelectorAll('.scherm-chiprow').forEach(fitChipRow);
    });
  }

  // RONDE 68: lettergrootte van namen/chips afstemmen op de effectieve rij-/kolomhoogte, zodat de
  // matrix -- ongeacht hoeveel dagen/personen ingesteld staan -- altijd leesbaar maar nooit
  // overlopend op 1 scherm past (geen scrollen toegelaten, zie <style> hierboven).
  // Ronde "scherm-max8": neemt nu het grid-element zelf als parameter (i.p.v. een vast element-id
  // op te zoeken) -- bij meer dan MAX_PERSONEN_PER_RIJ personen bestaan er immers meerdere
  // grid-elementen, elk met hun eigen schaal.
  function scaleSchermGrid(grid, aantalPersonen, aantalDagen){
    if(!grid) return;
    const headEl = grid.querySelector('.scherm-head-cell:not(.scherm-head-corner)');
    const headH = headEl ? headEl.getBoundingClientRect().height : 36;
    const rect = grid.getBoundingClientRect();
    const rowH = Math.max(16, (rect.height - headH) / Math.max(1, aantalDagen));
    const colW = Math.max(36, (rect.width - DATE_COL_W) / Math.max(1, aantalPersonen));
    const nameFs = Math.max(9, Math.min(15, Math.min(rowH * 0.30, colW * 0.15)));
    const chipFs = Math.max(8.5, Math.min(13, rowH * 0.24));
    grid.style.setProperty('--scherm-name-fs', nameFs.toFixed(1) + 'px');
    grid.style.setProperty('--scherm-chip-fs', chipFs.toFixed(1) + 'px');
  }

  // RONDE 68: als de chips van 1 cel niet allemaal verticaal passen (te veel afspraken op 1 dag
  // voor 1 persoon binnen de beschikbare rijhoogte), toont de cel enkel wat past + een "+N"-badge
  // i.p.v. de cel te laten overlopen (wat de rij-/pagina-hoogte zou verstoren -- niet toegelaten op
  // dit geen-scroll-scherm). Altijd minstens 1 chip zichtbaar houden.
  function fitChipRow(wrapEl){
    const chips = Array.from(wrapEl.children).filter(c => c.classList.contains('scherm-chip'));
    if(chips.length < 2) return;
    let more = wrapEl.querySelector('.scherm-chip-more');
    if(more) more.remove();
    chips.forEach(c => c.style.display = '');
    if(wrapEl.scrollHeight <= wrapEl.clientHeight + 1) return;
    let hidden = 0;
    for(let i = chips.length - 1; i >= 1; i--){
      chips[i].style.display = 'none';
      hidden++;
      const badge = document.createElement('span');
      badge.className = 'scherm-chip-more';
      badge.textContent = '+' + hidden;
      wrapEl.appendChild(badge);
      if(wrapEl.scrollHeight <= wrapEl.clientHeight + 1) return;
      badge.remove();
    }
  }

  function chipHtml(it, projectNaamById, projectGemeenteById, projectLeiderById, toonGemeente, toonProjectleider){
    const dagdeelPrefix = it.dagdeel === 'vm' ? 'VM · ' : it.dagdeel === 'nm' ? 'NM · ' : '';
    if(it.type === 'status'){
      const st = IP_STATUSES[it.status] || { label: it.status || '?', cls: 'vrij' };
      const uur = (it.status === 'KEURING' && it.van_uur) ? ' ' + String(it.van_uur).slice(0,5) : '';
      const proj = it.project_id ? projectNaamById[String(it.project_id)] : (it.omschrijving || '');
      const projSuffix = (it.status === 'KEURING' && proj) ? ' — ' + escapeHtml(proj) : '';
      return '<span class="scherm-chip ' + st.cls + '" title="' + escapeHtml(st.label + uur + projSuffix) + '">' + dagdeelPrefix + escapeHtml(st.label) + uur + projSuffix + '</span>';
    }
    const naam = it.project_id ? (projectNaamById[String(it.project_id)] || '(verwijderd)') : (it.omschrijving || '(verwijderd)');
    const cls = it.project_id ? 'project' : 'vrij';
    // Ronde "scherm-max8": gemeente/projectleider enkel bij een echte projecttoewijzing (niet bij
    // "vrije invoer"/verwijderd project), enkel als ze gekend zijn, en enkel als Peter ze via de
    // nieuwe vinkjes in Bedrijfsgegevens heeft aangezet (toonGemeente/toonProjectleider).
    const gemeente = (it.project_id && toonGemeente) ? (projectGemeenteById[String(it.project_id)] || '') : '';
    const leider = (it.project_id && toonProjectleider) ? (projectLeiderById[String(it.project_id)] || '') : '';
    const subRegels = [];
    if(gemeente) subRegels.push('<span class="scherm-chip-sub">' + escapeHtml(gemeente) + '</span>');
    if(leider) subRegels.push('<span class="scherm-chip-sub scherm-chip-leider">' + escapeHtml(leider) + '</span>');
    if(!subRegels.length){
      return '<span class="scherm-chip ' + cls + '" title="' + escapeHtml(naam) + '">' + dagdeelPrefix + escapeHtml(naam) + '</span>';
    }
    const titleParts = [naam].concat(gemeente ? [gemeente] : [], leider ? [leider] : []);
    return '<span class="scherm-chip ' + cls + ' scherm-chip-detailed" title="' + escapeHtml(titleParts.join(' — ')) + '">'
      + '<span class="scherm-chip-naam">' + dagdeelPrefix + escapeHtml(naam) + '</span>'
      + subRegels.join('')
      + '</span>';
  }

  function tikKlok(){
    document.getElementById('scherm-klok').textContent = new Date().toLocaleTimeString('nl-BE', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
  }
  tikKlok();
  setInterval(tikKlok, 1000);
})();
</script>

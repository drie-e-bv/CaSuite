<!-- CaDraw (testversie, 2026-11-16). Losstaande pagina van CaSuite: eendraadschema + situatieplan.
     Leest CaDos (project_elektro_dossiers) en CaCalc (project_cacalc_data), bewaart in
     project_cadraw_data en schrijft gewijzigde waarden van gekoppelde kringen terug naar CaDos.

<style>

html,body{margin:0}
body{font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-text-size-adjust:100%}
header{background:#101114;color:#fff;padding:9px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px}
header .tag{font-size:11px;border:1px solid #555;border-radius:20px;padding:1px 8px;color:#cfd3da}
header .sp{flex:1}

nav{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);display:flex;overflow-x:auto}
nav button{flex:1 0 auto;min-width:84px;border:0;border-radius:0;background:none;padding:11px 8px;font:inherit;font-weight:600;color:var(--mut);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--ink);border-bottom-color:var(--acc)}
nav .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--warn);color:#fff;font-size:11px;line-height:18px}
main{padding:12px;max-width:1280px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.card>h2{font-size:14px;margin:0 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card>h2 small{font-weight:400;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f.w2{grid-column:span 2}
.f span{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
input,select,textarea{font:inherit;color:inherit;border:1px solid var(--line);border-radius:7px;padding:7px 8px;background:#fff;min-width:0;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid #b9d6f5;border-color:var(--acc)}
button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 11px;cursor:pointer;color:var(--ink)}
button:hover{background:#f1f3f6}
button.pri,button.on2{background:var(--acc);border-color:var(--acc);color:#fff}
button.danger{color:var(--danger)}
button.sm{padding:4px 8px;font-size:13px}
header button{background:#23252b;border-color:#3a3d45;color:#fff}
header button:hover{background:#30333b}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.row select,.row input{width:auto;max-width:100%}
.lb{background:#101114;color:#fff;border-radius:5px;padding:1px 7px;font-size:13px}
details.k{border:1px solid var(--line);border-radius:8px;margin-top:8px;background:#fcfcfd}
details.k>summary{padding:9px 10px;cursor:pointer;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;list-style:none}
details.k>summary::-webkit-details-marker{display:none}

.pages{overflow:auto;background:#8d939c;border-radius:10px;padding:10px;max-height:78vh}
.pages svg{display:block;background:#fff;margin:0 auto 10px;box-shadow:0 1px 6px rgba(0,0,0,.35)}

.lib{overflow:auto;max-height:46vh;border:1px solid var(--line);border-radius:8px;margin-top:8px}

.lib h4{margin:0;padding:5px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);background:#f4f5f7;position:sticky;top:0}
.sy{display:flex;align-items:center;gap:8px;width:100%;border:0;border-radius:0;border-bottom:1px solid #eef0f3;padding:5px 8px;text-align:left;font-size:13.5px}

.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}

#plan .pi.dim{opacity:.35;pointer-events:none}

.pch{padding:6px 8px;font-size:13px;background:#f4f5f7;position:sticky;top:0;z-index:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc{display:flex;align-items:center;gap:6px;width:100%;border:0;border-radius:0;border-bottom:1px solid #eef0f3;padding:4px 6px;text-align:left;font-size:13px}
.pc svg{flex:none;width:36px;height:24px}.pc span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pc em{font-style:normal;color:#12b76a;font-weight:700}
.pc.gepl{color:#98a2b3}.pc.gepl svg{opacity:.45}.pc.on{background:#e3effc;box-shadow:inset 3px 0 0 var(--acc)}

@media(max-width:860px){.pws{grid-template-columns:minmax(0,1fr)}.pside{position:static;max-height:none}.pcols{grid-template-columns:minmax(0,1fr)}.plet{flex-direction:row;overflow-x:auto;max-height:none}.plk{flex:none;min-width:46px}.plh{align-self:center;margin:0 2px}.pcomp{max-height:220px}.pzoom{margin-left:0}}
#plan .pi .hb{fill:transparent}
#plan .pi.sel .hb{fill:rgba(11,107,203,.14);stroke:#0b6bcb;stroke-width:.8}
#plan .wl{stroke:transparent;stroke-width:14;cursor:pointer}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut)}
td.n,th.n{text-align:right;white-space:nowrap}
.tw{overflow-x:auto}
.tw td select{min-width:68px;padding-right:22px}
.tw td select[data-cfg$='.kabelType']{min-width:88px}

.chk.i{background:var(--infobg);border-color:#cfe0fb}
.note{color:var(--mut);font-size:13px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#101114;color:#fff;padding:9px 14px;border-radius:9px;display:none;gap:12px;align-items:center;z-index:30;max-width:92vw;box-shadow:0 4px 16px rgba(0,0,0,.3)}
#toast button{background:none;border:0;color:#8ec5ff;padding:0;font-weight:600}
#ovl{position:fixed;inset:0;background:rgba(16,17,20,.55);z-index:20;display:none;align-items:flex-start;justify-content:center;padding:6vh 12px;overflow:auto}
#ovl .card{width:100%;max-width:560px}
.pl{display:flex;justify-content:space-between;gap:8px;padding:9px 6px;border-bottom:1px solid var(--line);cursor:pointer}
.pl:hover{background:#f1f3f6}
.pl small{color:var(--mut)}
html.emb header h1,html.emb header .tag{display:none}
html.emb header{padding-top:4px;padding-bottom:4px}
</style>

const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'');
const $=s=>document.querySelector(s);

const TYPES={
 sc_ak:{l:'Stopcontact geaard + kinderveiligheid',c:'sc',g:'Stopcontacten'},
 sc_a:{l:'Stopcontact geaard',c:'sc',g:'Stopcontacten'},
 sc:{l:'Stopcontact zonder aarding',c:'sc',g:'Stopcontacten'},

 swk:{l:'Kruisschakelaar',c:'sw',g:'Schakelaars'},
 dk:{l:'Drukknop',c:'sw',g:'Schakelaars'},
 dim:{l:'Dimmer',c:'sw',g:'Schakelaars'},
 bm:{l:'Bewegingsmelder',c:'sw',g:'Schakelaars'},
 t_was:{l:'Wasmachine',c:'toe',g:'Toestellen'},
 t_droog:{l:'Droogkast',c:'toe',g:'Toestellen'},

 t_ev:{l:'Laadstation auto',c:'toe',g:'Toestellen'},
 t_trafo:{l:'Transformator',c:'toe',g:'Toestellen'},

 t_pv:{l:'Omvormer zonnepanelen',c:'toe',g:'Toestellen'},
 t_gen:{l:'Toestel (vrije tekst)',c:'toe',g:'Toestellen'},
 af:{l:'Aftakkast',c:'div',g:'Overige'},
 ap:{l:'Aansluitpunt',c:'div',g:'Overige'},
 dom:{l:'Module / klein toestel (tekst)',c:'div',g:'Overige'}
};
const NETTEN=['3 x 400V + N ~ 50Hz','3 x 230V ~ 50Hz','1 x 230V + N ~ 50Hz'];
/* symbolen van de extra lagen op het situatieplan (niet in het eendraadschema) */
const LTYPES={
 ls:{l:'Luidspreker (wand)',laag:'muziek'},ls_p:{l:'Luidspreker (inbouw plafond)',laag:'muziek'},sub:{l:'Subwoofer',laag:'muziek'},mz_kp:{l:'Bediening muziek',laag:'muziek'},mz_bron:{l:'Bron / streamer',laag:'muziek'},
 al_cen:{l:'Alarmcentrale',laag:'alarm'},al_pir:{l:'Bewegingsdetector (PIR)',laag:'alarm'},al_mc:{l:'Magneetcontact',laag:'alarm'},al_sir:{l:'Sirene',laag:'alarm'},al_rook:{l:'Brand-/rookmelder',laag:'alarm'},al_sens:{l:'Sensor',laag:'alarm'},al_bus:{l:'Bustoestel / bediening',laag:'alarm'},al_gen:{l:'Alarmtoestel',laag:'alarm'},
 nw_rj:{l:'Datapunt (RJ45)',laag:'netwerk'},nw_ap:{l:'WiFi access point',laag:'netwerk'},nw_cam:{l:'Camera',laag:'netwerk'},nw_tst:{l:'Netwerktoestel',laag:'netwerk'}};

/* ================= model ================= */
const newKring=(o={})=>Object.assign({id:uid(),naam:'',polen:'2P',curve:'C',A:20,kA:3,kabelType:'XVB',kabel:'3G2,5',lengte:'',punten:[]},o);

 project:{naam:'',adres:'',klant:'',installateur:'Casentis',tekenaar:'',organisme:'',ean:'',datum:new Date().toISOString().slice(0,10),net:NETTEN[0],voeding:'EXVB 4x10',aarding:'< 30 Ω'},
 borden:[newBord()],plannen:[newPlan()],kamers:[],print:{schema:true,plan:true,kringen:true,mat:false}}}
const num=v=>parseInt(String(v??'').replace(/[^\d]/g,''),10)||'';
const kabFmt=s=>String(s||'').trim().toUpperCase().replace('.',',');

/* ---- import uit CaDos (project_elektro_dossiers.data) : zelfde groeps- en codelogica als CaDos ---- */
function cadosCodes(rijen){
 const L='ABCDEFGHIJKLMNOPQRSTUVWXYZ',flat=[],byId={},groupOf={},codes={},letterOf={};
 rijen.forEach(r=>(r.items||[]).forEach(m=>{flat.push(m);byId[m.id]=m}));
 rijen.forEach(r=>{let last=null;(r.items||[]).forEach(m=>{
  if(m.categorie==='Differentieel')last=m;
  else if(m.categorie==='Automaat'&&m.isRem)last=null;
  else if(m.categorie==='Automaat'){const l=m.linkedDiffId&&byId[m.linkedDiffId];groupOf[m.id]=(l&&l.categorie==='Differentieel')?l:last}
  else last=null})});
 const hi=flat.findIndex(m=>m.categorie==='Differentieel'&&m.isHoofd);let di=-1,pi=-1;
 flat.forEach((m,i)=>{if(!(m.categorie==='Differentieel'||(m.categorie==='Automaat'&&!m.isRem&&!groupOf[m.id])))return;
  if(hi!==-1&&i<hi){pi++;letterOf[m.id]='X'+(L[pi]||('Z'+pi))}else{di++;letterOf[m.id]=L[di]||('Z'+di)}});
 const sub={};let rem=0;
 flat.forEach(m=>{if(m.categorie==='Differentieel')codes[m.id]=letterOf[m.id];
  else if(m.categorie==='Automaat'&&m.isRem){rem++;codes[m.id]='R'+rem}
  else if(m.categorie==='Automaat'){const d=groupOf[m.id];if(d){const n=sub[d.id]||0;codes[m.id]=letterOf[d.id]+(L[n]||n);sub[d.id]=n+1}else codes[m.id]=letterOf[m.id]}});
 return{codes,groupOf,flat}}
function fromCaDos(src){

function opsSVG(ops,edit){const f={n:'none',w:'#fff',b:'#000'};let s='',top='';

  else if(t==='C')s+=`<circle cx="${o[1].toFixed(2)}" cy="${o[2].toFixed(2)}" r="${o[3].toFixed(2)}" fill="${f[o[4]]}" stroke="#000" stroke-width="${(+o[5]).toFixed(2)}"/>`;
  else if(t==='R')s+=`<rect x="${o[1].toFixed(2)}" y="${o[2].toFixed(2)}" width="${o[3].toFixed(2)}" height="${o[4].toFixed(2)}" fill="${f[o[5]]}" stroke="#000" stroke-width="${(+o[6]).toFixed(2)}"/>`;

  else if(t==='T')s+=`<text x="${o[1].toFixed(2)}" y="${o[2].toFixed(2)}" font-size="${o[4].toFixed(2)}" text-anchor="${{s:'start',m:'middle',e:'end'}[o[5]]}"${o[6]?` transform="rotate(${-o[6]} ${o[1].toFixed(2)} ${o[2].toFixed(2)})"`:''}${o[7]?' font-weight="700"':''}${o[8]?' font-style="italic"':''}${o[9]?` fill="${o[9]}"`:''}>${esc(o[3])}</text>`;
  else if(t==='H'&&edit)s+=`<rect class="hit${E.sel===o[5]?' sel':''}" data-h="${o[5]}" x="${o[1].toFixed(2)}" y="${o[2].toFixed(2)}" width="${o[3]}" height="${o[4].toFixed(2)}"/>`;
  else if(t==='A'&&edit&&E.mode==='teken'&&((o[3][0]==='p')===!!TYPES[E.sym]))top+=`<g class="addm" data-add="${o[3]}" transform="translate(${o[1].toFixed(2)} ${o[2].toFixed(2)})"><circle r="2.3"/><path d="M-1.2 0H1.2M0 -1.2V1.2"/></g>`;}

   else if(t==='C'){doc.setLineWidth(o[5]);doc.setDrawColor(0);if(o[4]==='b'){doc.setFillColor(0);doc.circle(o[1],o[2],o[3],'FD')}else if(o[4]==='w'){doc.setFillColor(255,255,255);doc.circle(o[1],o[2],o[3],'FD')}else doc.circle(o[1],o[2],o[3],'S')}
   else if(t==='R'){doc.setLineWidth(o[6]);doc.setDrawColor(0);if(o[5]==='w'){doc.setFillColor(255,255,255);doc.rect(o[1],o[2],o[3],o[4],'FD')}else doc.rect(o[1],o[2],o[3],o[4],'S')}
   else if(t==='F'){doc.setFillColor(0);doc.triangle(o[1],o[2],o[3],o[4],o[5],o[6],'F')}
   else if(t==='T'){let str=o[3].replace(/Ω/g,'Ohm'),x=o[1];const z=o[4];
    doc.setFont('helvetica',o[7]&&o[8]?'bolditalic':o[7]?'bold':o[8]?'italic':'normal');doc.setFontSize(z*pt);doc.setTextColor(o[9]||'#000000');
    if(str[0]==='Δ'){doc.setLineWidth(.18+.12*o[7]);doc.setDrawColor(0);doc.triangle(x,o[2],x+.66*z,o[2],x+.33*z,o[2]-.72*z,'S');x+=.8*z;str=str.slice(1)}

  }});

   g.kringen.forEach(k=>{add(`Automaat ${k.polen} ${k.curve}${k.A}A ${k.kA||''}kA`);
    const kab=`Kabel ${k.kabelType} ${k.kabel}`;if(+k.lengte>0)add(kab+' (meter)',+k.lengte);else add(kab+' (kringen zonder lengte)');

function checks(st){const w=[],cd=codes(st),add=(lvl,msg,kid)=>w.push({lvl,msg,kid}),geplaatst=new Set(st.plannen.flatMap(p=>p.items.map(i=>i.pid)));

  if(!b.groepen.some(g=>g.sub&&+g.mA<=30)&&+b.hoofd.mA>30&&b.groepen.some(g=>g.kringen.length))add('w',`${bn}geen differentieel van max. 30 mA na het hoofddifferentieel.`);
  b.groepen.forEach(g=>{const prot=g.sub?+g.mA:+b.hoofd.mA;

   if(sc>8)add('w',`${c}: ${sc} contactdozen op één kring (maximaal 8 enkelvoudige of meervoudige).`,k.id);
   else if(sc&&li&&sc+li>8)add('w',`${c}: gemengde kring met ${sc+li} punten (stopcontacten + lichtpunten, maximaal 8).`,k.id);
   if(mm===1.5&&+k.A>16)add('w',`${c}: 1,5 mm² beveiligd met ${k.A}A (automaat maximaal 16A).`,k.id);

   const nat=k.punten.some(p=>['t_was','t_droog','t_vaat'].includes(p.type))||/badkamer|douche|wasmachine|droogkast|vaatwas/i.test(k.naam);

 else if(a==='pkr'){P.kring=b.dataset.kid;const pls=geplaatst(),g=laagGroepen(P.laag).find(x=>x.id===P.kring),n=g&&g.comps.find(c=>!pls.has(c.id));P.punt=n?'pid:'+n.id:(g&&g.nieuw==='muziek'&&!g.comps.length?'new:ls':'');P.mode='teken';P.wat='punt';P.sel=null;render()}
 else if(a==='plaag'){P.laag=b.dataset.l;P.kring='';P.punt='';P.sel=null;P.mode='teken';P.wat='punt';autoPunt();render()}
 else if(a==='ptoon'){P.toon[b.dataset.k]=b.checked;render()}
 else if(a==='mzWeg'){const id=b.dataset.pp;mut('Luidspreker gewist',()=>{Object.values(S.muziekPunten||{}).forEach(l=>{const i=l.findIndex(x=>x.id===id);if(i>=0)l.splice(i,1)});S.plannen.forEach(p=>{p.items=p.items.filter(x=>x.pid!==id)});P.sel=null})}
 else if(a==='ppick'){const pid=b.dataset.pp,pi2=S.plannen.findIndex(p=>p.items.some(i=>i.pid===pid));
  if(pi2>=0){P.pi=pi2;P.sel=S.plannen[pi2].items.find(i=>i.pid===pid).id;P.mode='sel';render();const g=document.querySelector(`[data-it="${P.sel}"]`);if(g)g.scrollIntoView({block:'center',inline:'center'})}
  else{P.punt='pid:'+pid;P.mode='teken';P.wat='punt';P.sel=null;render()}}
 else if(a==='delTx')mut('Tekst gewist',()=>{pl.teksten=pl.teksten.filter(t=>t.id!==P.sel);P.sel=null});
 else if(a==='addPlan'){const n=await ask('Naam van de verdieping','Verdieping '+S.plannen.length);if(n)mut('',()=>{S.plannen.push(newPlan(n));P.pi=S.plannen.length-1})}
 else if(a==='delPlan')mut('Verdieping verwijderd',()=>{S.plannen.splice(P.pi,1);P.pi=0});
 else if(a==='noBg')mut('Achtergrond verwijderd',()=>{pl.bg=null});
 else if(a==='cadLagen')cadLagenDialoog();
 else if(a==='cadWeg'){$('#ovl').style.display='none';mut('AutoCAD-laag verwijderd',()=>{delete pl.cad})}
 else if(a==='rot'){const it=pl.items.find(i=>i.id===P.sel);if(it)mut('',()=>{it.rot=((it.rot||0)+1)%4})}
 else if(a==='delIt')mut('Van het plan gehaald',()=>{pl.items=pl.items.filter(i=>i.id!==P.sel);P.sel=null});
 else if(a==='proj')cloud.picker('');
 else if(a==='closeOvl'){$('#ovl').style.display='none'}
 else if(a==='syncCados')cloud.resync();
 else if(a==='syncCalc')cloud.calc();
});
/* ---- situatieplan: aanwijzer ---- */
function svgPt(e){const s=$('#plan'),p=s.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(s.getScreenCTM().inverse());return[Math.round(q.x),Math.round(q.y)]}
function snapPt(pl,x,y,skip){let best=null,bd=14;[...pl.muren,...cadSegs(pl)].forEach(m=>{[[m[0],m[1]],[m[2],m[3]]].forEach(c=>{const dd=Math.hypot(c[0]-x,c[1]-y);if(dd<bd){bd=dd;best=c}})});return best||[x,y]}
function wallSnap(pl,x,y){let best=null,bd=16;[...pl.muren,...cadSegs(pl)].forEach(m=>{const dx=m[2]-m[0],dy=m[3]-m[1],l2=dx*dx+dy*dy;if(!l2)return;const t=clamp(((x-m[0])*dx+(y-m[1])*dy)/l2,0,1),px=m[0]+t*dx,py=m[1]+t*dy,dd=Math.hypot(px-x,py-y);if(dd<bd){bd=dd;best=[Math.round(px),Math.round(py)]}});return best||[x,y]}
const gridR=(v,st)=>P.snapGrid?Math.round(v/st)*st:v;
function plaatsPunt(pl,x0,y0){let[x,y]=[x0,y0];if(P.snapMuur){const w=wallSnap(pl,x0,y0);if(w[0]!==x0||w[1]!==y0)return w}return[gridR(x,5),gridR(y,5)]}
document.addEventListener('pointerdown',e=>{const s=e.target.closest&&e.target.closest('#plan');if(!s||e.button===2)return;const pl=S.plannen[P.pi],[x,y]=svgPt(e),tl=ptool();
 if(tl==='muur'){const a=P.snapMuur?snapPt(pl,x,y):[x,y],a2=(a[0]===x&&a[1]===y)?[gridR(x,10),gridR(y,10)]:a;P.draw={x1:a2[0],y1:a2[1],x2:a2[0],y2:a2[1]};s.setPointerCapture(e.pointerId);e.preventDefault()}
 else if(tl==='hand'){const g=e.target.closest('[data-it],[data-tx]');
  if(g){const it=g.dataset.it?pl.items.find(i=>i.id===g.dataset.it):pl.teksten.find(t=>t.id===g.dataset.tx);P.sel=it.id;P.drag={it,g,tx:!!g.dataset.tx,sx:x,sy:y,ox:it.x,oy:it.y,moved:false};g.setPointerCapture(e.pointerId);e.preventDefault()}
  else if(P.sel){P.sel=null;render()}}});
document.addEventListener('pointermove',e=>{
 if(!P.draw&&!P.drag&&ptool()==='punt'&&e.pointerType!=='touch'){const g=$('#ghost');if(g&&g.firstChild&&e.target.closest&&e.target.closest('#plan')){const pl=S.plannen[P.pi],[x0,y0]=svgPt(e),q=plaatsPunt(pl,x0,y0);P.last=q;g.setAttribute('transform',`translate(${q[0]} ${q[1]})`);g.setAttribute('visibility','visible')}else if(g)g.setAttribute('visibility','hidden')}
 if(P.draw){let[x,y]=svgPt(e);const d=P.draw,dx=Math.abs(x-d.x1),dy=Math.abs(y-d.y1);if(dx<dy*.18)x=d.x1;else if(dy<dx*.18)y=d.y1;
  let a=P.snapMuur?snapPt(S.plannen[P.pi],x,y):[x,y];if(a[0]===x&&a[1]===y)a=[d.x1===x?x:gridR(x,10),d.y1===y?y:gridR(y,10)];d.x2=a[0];d.y2=a[1];
  const pv=$('#prev');if(pv){pv.setAttribute('x1',d.x1);pv.setAttribute('y1',d.y1);pv.setAttribute('x2',d.x2);pv.setAttribute('y2',d.y2);pv.setAttribute('visibility','visible')}}
 else if(P.drag){const[x,y]=svgPt(e),g=P.drag;if(Math.hypot(x-g.sx,y-g.sy)>3)g.moved=true;if(g.moved)g.g.setAttribute('transform',`translate(${x-g.sx} ${y-g.sy})`);g.nx=g.ox+x-g.sx;g.ny=g.oy+y-g.sy}});
document.addEventListener('pointerup',async e=>{if(e.button===2)return;const pl=S.plannen[P.pi];
 if(P.draw){const d=P.draw;P.draw=null;if(Math.hypot(d.x2-d.x1,d.y2-d.y1)>10)mut('',()=>pl.muren.push([d.x1,d.y1,d.x2,d.y2]));else render();return}
 if(P.drag){const g=P.drag;P.drag=null;if(g.moved){snap();const w=g.tx?[gridR(g.nx,5),gridR(g.ny,5)]:plaatsPunt(pl,g.nx,g.ny);g.it.x=clamp(w[0],0,1000);g.it.y=clamp(w[1],0,pl.h||707);persist()}render();return}
 const s=e.target.closest&&e.target.closest('#plan');if(!s)return;const tl=ptool();
 if(tl==='gom'){const w=e.target.closest('[data-w]'),g=e.target.closest('[data-it]'),t=e.target.closest('[data-tx]');
  if(g)mut('Van het plan gehaald',()=>{pl.items=pl.items.filter(i=>i.id!==g.dataset.it)});else if(t)mut('Tekst gewist',()=>{pl.teksten=pl.teksten.filter(x=>x.id!==t.dataset.tx)});else if(w)mut('Muur gewist',()=>pl.muren.splice(+w.dataset.w,1))}
 else if(tl==='tekst'){const[x,y]=svgPt(e);const t=await ask('Tekst op het plan','');if(t&&t.trim())mut('',()=>{if(!pl.teksten)pl.teksten=[];const o={id:uid(),x:gridR(x,5),y:gridR(y,5),t:t.trim(),z:12};pl.teksten.push(o)})}
 else if(tl==='punt'){const g=laagGroepen(P.laag).find(x=>x.id===P.kring);if(!g){toast(P.laag==='elektro'?'Teken eerst een kring in het eendraadschema.':'Niets te plaatsen in deze laag.');return}
  if(!P.punt){toast(`Alles van ${g.code} staat op het plan. Kies links een andere letter${g.nieuw||P.laag==='elektro'?' of "+ nieuw"':''}.`);return}
  const[x0,y0]=svgPt(e),[x,y]=plaatsPunt(pl,x0,y0),laag=P.laag;
  mut('',()=>{let pid;if(P.punt.startsWith('pid:'))pid=P.punt.slice(4);
   else if(laag==='elektro'){const p=newPunt(P.punt.slice(4),{tekst:''});g.k.punten.push(p);pid=p.id}
   else{const mp=S.muziekPunten||(S.muziekPunten={}),l=mp[g.ref]||(mp[g.ref]=[]),c={id:'mzp_'+uid(),type:P.punt.slice(4),tekst:''};l.push(c);pid=c.id}
   const it={id:uid(),pid,x,y,rot:P.rot};if(laag!=='elektro')it.laag=laag;pl.items.push(it);P.sel=null;P.last=[x,y];
   if(P.punt.startsWith('pid:')){const pls=geplaatst(),g2=laagGroepen(laag).find(z=>z.id===g.id),n=g2&&g2.comps.find(c=>!pls.has(c.id));
    if(n)P.punt='pid:'+n.id;else{const van=g.code,nx=autoPunt(g.id);setTimeout(()=>toast(nx?`${van} volledig geplaatst - verder met ${nx.code}`:`${van} geplaatst - alles van deze laag staat op het plan`))}}})}});
document.addEventListener('contextmenu',e=>{const s=e.target.closest&&e.target.closest('#plan');if(!s)return;e.preventDefault();const pl=S.plannen[P.pi],tl=ptool();
 if(tl==='punt'&&P.punt){P.rot=(P.rot+1)%4;const g=$('#ghost');if(g)g.innerHTML=ghostHtml(pl);const kb=$('[data-a=prot]');if(kb)kb.textContent=`↻ Draaien (${P.rot*90}°)`;return}
 const g=e.target.closest('[data-it]');if(g){const it=pl.items.find(i=>i.id===g.dataset.it);if(it)mut('',()=>{it.rot=((it.rot||0)+1)%4;P.sel=it.id})}});
document.addEventListener('keydown',e=>{if(tab!=='plan'||/INPUT|SELECT|TEXTAREA/.test((document.activeElement||{}).tagName||''))return;
 if(e.key==='r'||e.key==='R'){if(ptool()==='punt'&&P.punt){P.rot=(P.rot+1)%4;const g=$('#ghost');if(g)g.innerHTML=ghostHtml(S.plannen[P.pi]);const kb=$('[data-a=prot]');if(kb)kb.textContent=`↻ Draaien (${P.rot*90}°)`}
  else if(P.sel){const it=S.plannen[P.pi].items.find(i=>i.id===P.sel);if(it)mut('',()=>{it.rot=((it.rot||0)+1)%4})}}
 else if(e.key==='Escape'){P.mode='sel';P.sel=null;render()}
 else if((e.key==='Delete'||e.key==='Backspace')&&P.sel){const pl=S.plannen[P.pi];mut('Van het plan gehaald',()=>{pl.items=pl.items.filter(i=>i.id!==P.sel);pl.teksten=(pl.teksten||[]).filter(t=>t.id!==P.sel);P.sel=null})}});

/* ================= CaSuite-koppeling (Supabase) ================= */
const cloud={sb:null,pid:null,proj:null,projecten:[],plannen:[],dirty:false,t:null,who:'',backup:false,saving:false,
 status(s){$('#cst').textContent=s},
 async init(){
  $('#bproj').style.display='';this.status('Verbinden...');
  try{if(EMB){this.sb=EMB.sb;$('#bproj').style.display='none'}else{await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js');
   this.sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY)}
   const{data}=await this.sb.auth.getSession();
   if(!data.session){this.status('Niet aangemeld');$('#v').innerHTML=`<div class="card"><h2>Aanmelden</h2><p>CaDraw gebruikt je aanmelding van CaSuite. Open eerst <a href="./index.html">CaSuite</a>, meld je daar aan en kom dan terug naar deze pagina.</p><button onclick="location.reload()">Opnieuw proberen</button></div>`;$('#tabs').innerHTML='';return}
   const u=data.session.user;this.who=((u.user_metadata&&(u.user_metadata.full_name||u.user_metadata.name||u.user_metadata.email))||u.email||'onbekend')+' (CaDraw)';
   try{const c=await this.sb.from('elektro_cados_instellingen').select('waarde').eq('sleutel',CFG_KEY).maybeSingle();
    if(c.data&&c.data.waarde&&Array.isArray(c.data.waarde.presets)){CFG.presets=c.data.waarde.presets.map(normPreset);try{localStorage.setItem('cadraw-instellingen',JSON.stringify(CFG))}catch(e){}}else if(!c.error)saveCfg()}catch(e){}
   const r=await this.sb.from('projecten').select('id,naam,projectnummer,klant,locatie,actief').order('naam');if(r.error)throw r.error;this.projecten=r.data||[];
   if(EMB){const id=EMB.projectId();if(id&&this.projecten.some(p=>p.id===id))await this.open(id);else this.geenProject();return}
   const want=new URLSearchParams(location.search).get('project')||(()=>{try{return localStorage.getItem('cadraw-project')}catch(e){return null}})();
   if(want&&this.projecten.some(p=>p.id===want))await this.open(want);else{this.status('');this.picker('')}
  }catch(err){this.status('Fout');$('#v').innerHTML=`<div class="card"><h2>Verbinding mislukt</h2><p>${esc(err.message||err)}</p><button onclick="location.reload()">Opnieuw proberen</button></div>`}},
 geenProject(){this.pid=null;this.status('');$('#tabs').innerHTML='';$('#v').innerHTML='<div class="card"><h2>Kies een project</h2><p>Kies bovenaan in CaSuite het project waarvan je het eendraadschema en situatieplan wil tekenen. CaDraw leest de zekeringkast, verlichting, muziek, alarm en netwerk uit het CaDos-dossier van dat project.</p></div>'},
 picker(q){if(EMB)return;const o=$('#ovl'),f=norm(q),list=this.projecten.filter(p=>p.actief!==false&&(!f||norm(p.naam+' '+(p.projectnummer||'')+' '+(p.klant||'')).includes(f)));
  const html=list.slice(0,80).map(p=>`<div class="pl" data-pid="${p.id}"><span><b>${esc(p.naam)}</b>${p.klant?'<br><small>'+esc(p.klant)+'</small>':''}</span><small>${esc(p.projectnummer||'')}</small></div>`).join('')||'<p class="note">Geen projecten gevonden.</p>';
  if($('#plist')){$('#plist').innerHTML=html;return}
  o.innerHTML=`<div class="card"><h2>Project kiezen<span style="flex:1"></span>${this.pid?'<button class="sm" data-a="closeOvl">Sluiten</button>':''}</h2><input id="pzoek" placeholder="Zoek op naam, nummer of klant" value="${esc(q)}"><div id="plist" style="margin-top:8px;max-height:60vh;overflow:auto">${html}</div></div>`;o.style.display='flex'},
 async open(pid){if(this.dirty)await this.save();$('#ovl').style.display='none';$('#ovl').innerHTML='';this.status('Laden...');
  try{const sb=this.sb,[own,dos,pls]=await Promise.all([sb.from('project_cadraw_data').select('*').eq('project_id',pid).maybeSingle(),sb.from('project_elektro_dossiers').select('*').eq('project_id',pid).maybeSingle(),sb.from('project_plannen').select('id,naam,afbeelding_url').eq('project_id',pid).order('created_at',{ascending:true})]);
   if(own.error)throw own.error;if(dos.error)throw dos.error;
   this.pid=pid;this.proj=this.projecten.find(p=>p.id===pid);this.plannen=(pls.data||[]).filter(p=>p.afbeelding_url);this.backup=false;
   try{localStorage.setItem('cadraw-project',pid)}catch(e){}
   let st=own.data&&own.data.data&&own.data.data.borden?migrate(own.data.data):null,nieuw=!st,msg='';
   if(dos.data&&dos.data.data&&dos.data.data.zekeringen){const fresh=fromCaDos(dos.data.data);delete fresh._over;st=st?keep(st,fresh):fresh}
   if(!st)st=blank();
   if(nieuw){const p=this.proj||{};st.project.naam=st.project.naam||p.naam||'';st.project.adres=st.project.adres||p.locatie||'';st.project.klant=st.project.klant||p.klant||'';
    const c=await sb.from('project_cacalc_data').select('data').eq('project_id',pid).maybeSingle();
    if(c.data&&c.data.data){if(allK(st))msg=' - er is ook een CaCalc-berekening (knop "Aanvullen uit CaCalc" onder Document)';else{try{const f=fromCaCalc(c.data.data);f.project=st.project;f.plannen=st.plannen;st=f;msg=', opgebouwd uit CaCalc'}catch(e){}}}
    msg=(dos.data?'Opgebouwd uit CaDos':'Nieuw CaDraw-dossier')+msg}
   S=st;bi=0;P.pi=0;P.sel=null;undoStack=[];E.sel=null;this.dirty=false;$('#bproj').textContent=(this.proj?this.proj.naam:'Project')+' ▾';this.status(nieuw?'Nog niet bewaard':'Geladen');render();
   if(msg)toast(msg);
  }catch(err){this.status('Fout');toast('Laden mislukt: '+(err.message||err))}},
 lock:Promise.resolve(),
 excl(fn){const p=this.lock.then(fn,fn);this.lock=p.catch(()=>{});return p},
 save(){return this.excl(()=>this._save())},
 async _save(){if(!this.pid)return;clearTimeout(this.t);this.dirty=false;this.status('Bewaren...');
  try{const nu=new Date().toISOString(),r=await this.sb.from('project_cadraw_data').upsert({project_id:this.pid,data:S,updated_at:nu,bijgewerkt_door:this.who},{onConflict:'project_id'}).select('id');
   if(r.error)throw r.error;if(!r.data||!r.data.length)throw new Error('geen rij bewaard (rechten?)');
   const n=await this.push();this.status('Bewaard '+new Date().toLocaleTimeString('nl-BE',{hour:'2-digit',minute:'2-digit'})+(n?` · ${n} waarden naar CaDos`:''));
  }catch(err){this.dirty=true;this.status('Niet bewaard!');toast('Bewaren mislukt: '+(err.message||err))}
  if(this.dirty){clearTimeout(this.t);this.t=setTimeout(()=>this.save(),4000)}},
 /* schrijft gewijzigde waarden van gekoppelde automaten/differentielen terug in het CaDos-dossier */
 async schrijfDossier(wijzig,tries=0){if(EMB&&!tries&&EMB.flushCados){try{await EMB.flushCados()}catch(e){}}const sb=this.sb,q=await sb.from('project_elektro_dossiers').select('*').eq('project_id',this.pid).maybeSingle();
  if(q.error)throw q.error;if(!q.data||!q.data.data||!q.data.data.zekeringen)return{ok:false,msg:'Dit project heeft geen CaDos-dossier met een zekeringkast.'};
  const row=q.data,d=JSON.parse(JSON.stringify(row.data)),r=wijzig(d);if(!r.ok||!r.n)return Object.assign(r,{data:d});
  if(!this.backup){const bk=await sb.from('dossier_backups').insert({dossier_id:row.id,data:row.data,reden:'CaDraw: voor terugschrijven'});if(bk.error)throw new Error('back-up van CaDos-dossier mislukt, niets teruggeschreven: '+bk.error.message);this.backup=true}
  const u=await sb.from('project_elektro_dossiers').update({data:d,updated_at:new Date().toISOString(),bijgewerkt_door:this.who}).eq('id',row.id).eq('updated_at',row.updated_at).select('id');
  if(u.error)throw u.error;if(!u.data||!u.data.length){if(tries<2)return this.schrijfDossier(wijzig,tries+1);throw new Error('Het CaDos-dossier werd intussen elders gewijzigd; probeer opnieuw.')}
  if(EMB&&EMB.cadosGewijzigd)try{EMB.cadosGewijzigd(this.pid)}catch(e){}
  return Object.assign(r,{data:d})},
 async push(){const r=await this.schrijfDossier(d=>{const x=syncVelden(d);return{ok:true,n:x.n,terug:x.terug}});
  if(r.terug&&r.terug.length){r.terug.forEach(t=>{t.obj.polen=t.oud});this.dirty=true;render();melding('Past niet in de kast',r.terug.map(t=>t.msg).join('\n'))}
  return r.n||0},
 kastOp(op){return this.excl(async()=>{if(this.dirty)await this._save();this.status('CaDos bijwerken...');
  const r=await this.schrijfDossier(d=>{const x=kastOp(d,op);if(x.ok){const v=syncVelden(d);x.n=1+v.n}return x});
  this.status(r.ok?'CaDos bijgewerkt':'');if(r.ok)this.dirty=true;return r})},
 async resync(){await this.save();await this.open(this.pid);toast('CaDos opnieuw ingelezen')},
 async calc(){try{const c=await this.sb.from('project_cacalc_data').select('data').eq('project_id',this.pid).maybeSingle();if(!c.data||!c.data.data){toast('Dit project heeft geen CaCalc-berekening.');return}
  snap();const n=mergeCaCalc(S,c.data.data);persist();render();toast(n?`${n} kringen aangevuld uit CaCalc (koppeling op naam)`:'Geen kringen met dezelfde naam gevonden in CaCalc',!!n)}catch(err){toast('CaCalc lezen mislukt: '+(err.message||err))}}
};
const allK=st=>st.borden.reduce((n,b)=>n+b.groepen.reduce((m,g)=>m+g.kringen.length,0),0);
window.addEventListener('beforeunload',e=>{if(CLOUD&&(cloud.dirty||bezig)){cloud.save();e.preventDefault();e.returnValue=''}});
document.addEventListener('visibilitychange',()=>{if(CLOUD&&document.hidden&&cloud.dirty)cloud.save()});
/* haken voor de hoofdsite (CaSuite): project wisselen, opnieuw inlezen bij terugkeer naar dit tabblad, wachtende wijzigingen bewaren */
window.CaDrawEmbed={
 async project(id){if(!cloud.sb)return;if(!id){if(cloud.dirty)await cloud.save();cloud.geenProject();return}
  if(!cloud.projecten.some(p=>p.id===id)){const r=await cloud.sb.from('projecten').select('id,naam,projectnummer,klant,locatie,actief').order('naam');if(!r.error)cloud.projecten=r.data||[]}
  if(!cloud.projecten.some(p=>p.id===id)){cloud.geenProject();return}
  if(id===cloud.pid&&(cloud.dirty||bezig))return;await cloud.open(id);if(!$('#tabs').innerHTML)render()},
 isDirty:()=>cloud.dirty||bezig,
 flush:()=>cloud.dirty?cloud.save():Promise.resolve()};
if(CLOUD)cloud.init();else render();
